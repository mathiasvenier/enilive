<style>
/* Dieselbe Lesbarkeitsskala wie im Dashboard */
:root{--t1:#2c3338;--t2:#4a5a63;--t3:#616f78;--tl:#93a1a8;
  --eni:#007BA9;--eni2:#0DB4E6;--rot:#c62828;--gruen:#15803d;--amber:#96530f}

/* Fußleiste */

<body>
<div id="app"><div class="start"><h2>Enilive Station Venier</h2>
  <p>Wird geladen …</p></div></div>
<script>
/* Version 1.0.0 – mobile Ansicht, liest aus demselben Google-Drive-Ordner
   wie das Dashboard. Ohne Tampermonkey. */
(function () {
'use strict';

/* ===== 10-store.js ===== */
/* ============================================================
   STORE – Einträge mit Zeitstempel, echtes Zusammenführen
   ------------------------------------------------------------
   Datenmodell (flach, damit Merge trivial bleibt):
     items: {
       "<key>": { t:<ms>, v:<wert> }      // aktiv
       "<key>": { t:<ms>, d:true }        // gelöscht (Grabstein)
     }
   Regel: Beim Zusammenführen gewinnt immer der höhere Zeitstempel.
   Grabsteine verhindern, dass gelöschte Einträge wieder auftauchen.
   ============================================================ */
const STORE = (() => {
  const LS_KEY   = 'eni_store_v2';
  const TOMB_TTL = 45 * 24 * 3600 * 1000;   // Grabsteine nach 45 Tagen entfernen

  let data    = { items: {} };
  let dirty   = false;
  const subs  = [];

  // ── intern ────────────────────────────────────────────────
  const now = () => Date.now();

  function readLS() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) {
        const p = JSON.parse(raw);
        if (p && p.items) return p;
      }
    } catch (_) {}
    return { items: {} };
  }

  /* Schreiben und Benachrichtigen werden gebündelt: Bei vielen Änderungen
     kurz hintereinander passiert beides nur einmal. Ohne das würde jede
     einzelne Änderung den kompletten Bestand schreiben und die Oberfläche
     neu aufbauen. */
  let flushTimer = null, needWrite = false, needNotify = false;

  /* Beim Schreiben immer erst den fremden Stand einmischen. Ohne das
     würde ein Tab die Änderungen eines anderen überschreiben, weil
     jedes Schreiben den gesamten Bestand ablegt. */
  function writeNow() {
    needWrite = false;
    try {
      const fresh = readLS();
      let got = 0;
      for (const k in fresh.items) {
        const r = fresh.items[k], l = data.items[k];
        if (!r || typeof r.t !== 'number') continue;
        if (!l || r.t > l.t) { data.items[k] = r; got++; }
      }
      localStorage.setItem(LS_KEY, JSON.stringify(data));
      if (got) needNotify = true;
    } catch (e) { console.warn('[Store] Speicher voll?', e); }
  }

  function flush() {
    flushTimer = null;
    const told = needWrite;
    if (needWrite)  writeNow();
    if (needNotify) { needNotify = false; subs.forEach(fn => { try { fn(); } catch (_) {} }); }
    // Andere Tabs erfahren sofort davon – ohne Umweg über das Netz
    if (told && typeof BUS !== 'undefined') BUS.send({ type: 'store' });
  }

  function writeLS() {
    needWrite = true;
    if (!flushTimer) flushTimer = setTimeout(flush, 0);
  }

  /* Ablegen ohne Einmischen. Nur für Fälle, in denen etwas absichtlich
     verschwinden soll – sonst würde das Einmischen es zurückholen. */
  function writeRaw() {
    needWrite = false;
    try { localStorage.setItem(LS_KEY, JSON.stringify(data)); }
    catch (e) { console.warn('[Store] Speicher voll?', e); }
  }

  function notify() {
    needNotify = true;
    if (!flushTimer) flushTimer = setTimeout(flush, 0);
  }

  /** Änderungen sofort festschreiben – vor dem Schließen der Seite. */
  function flushNow() { if (flushTimer) { clearTimeout(flushTimer); flush(); } else if (needWrite) writeNow(); }

  // ── öffentlich ────────────────────────────────────────────
  return {
    /** Lädt aus localStorage. Muss einmal beim Start laufen. */
    init() { data = readLS(); return this; },

    /** Rohdaten – nur für Sync und Backup. */
    raw()  { if (needWrite) writeNow(); return data; },

    /** Ausstehende Änderungen sofort sichern. */
    flushNow,

    /**
     * Aus dem lokalen Speicher nachlesen und einmischen.
     * Wird gebraucht, wenn ein anderer Tab etwas geändert hat.
     */
    reload() {
      if (needWrite) writeNow();          // Eigenes zuerst festschreiben
      const fresh = readLS();
      let changed = 0;
      for (const k in fresh.items) {
        const r = fresh.items[k], l = data.items[k];
        if (!r || typeof r.t !== 'number') continue;
        if (!l || r.t > l.t) { data.items[k] = r; changed++; }
      }
      if (changed) notify();
      return changed;
    },

    /** Wert setzen (überschreibt inkl. Grabstein). */
    put(key, value) {
      data.items[key] = { t: now(), v: value };
      dirty = true; writeLS(); notify();
      return value;
    },

    /** Eintrag löschen – hinterlässt Grabstein. */
    del(key) {
      if (!data.items[key]) return;
      data.items[key] = { t: now(), d: true };
      dirty = true; writeLS(); notify();
    },

    /** Wert lesen; null wenn nicht vorhanden oder gelöscht. */
    get(key, def = null) {
      const e = data.items[key];
      return (e && !e.d) ? e.v : def;
    },

    /** Existiert der Schlüssel (und ist nicht gelöscht)? */
    has(key) { const e = data.items[key]; return !!(e && !e.d); },

    /**
     * Alle Einträge eines Typs als Array [{key, ...wert}].
     * Konvention: Schlüssel lautet "<typ>:<id>".
     */
    list(type) {
      const pre = type + ':';
      const out = [];
      for (const k in data.items) {
        if (k.indexOf(pre) !== 0) continue;
        const e = data.items[k];
        if (!e || e.d) continue;
        out.push(Object.assign({ _key: k, _id: k.slice(pre.length) }, e.v));
      }
      return out;
    },

    /** Neuen Eintrag mit erzeugter ID anlegen. Gibt den Schlüssel zurück. */
    add(type, value) {
      const id  = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      const key = type + ':' + id;
      this.put(key, value);
      return key;
    },

    /**
     * Fremdstand einmischen. Gibt zurück, wie viele Einträge übernommen wurden.
     * Der lokale Stand bleibt erhalten, wo er neuer ist.
     */
    merge(remote) {
      if (!remote || !remote.items) return 0;
      let changed = 0;
      for (const k in remote.items) {
        const r = remote.items[k];
        if (!r || typeof r.t !== 'number') continue;
        const l = data.items[k];
        if (!l || r.t > l.t) { data.items[k] = r; changed++; }
      }
      if (changed) { writeLS(); notify(); }
      return changed;
    },

    /**
     * Alte Grabsteine entfernen, damit der Bestand nicht unbegrenzt wächst.
     * Erst alles zusammenführen, dann aufräumen, dann ohne Einmischen ablegen –
     * sonst kämen die entfernten Einträge beim nächsten Schreiben zurück.
     */
    sweep() {
      if (needWrite) writeNow();
      const cut = now() - TOMB_TTL;
      let n = 0;
      for (const k in data.items) {
        const e = data.items[k];
        if (e && e.d && e.t < cut) { delete data.items[k]; n++; }
      }
      if (n) writeRaw();
      return n;
    },

    /** Kompletten Stand ersetzen – für Backup-Import. */
    replaceAll(next) {
      if (!next || !next.items) return false;
      data = { items: next.items };
      writeLS(); notify();
      return true;
    },

    /** Bei jeder Änderung benachrichtigen (UI-Neuaufbau). */
    subscribe(fn) { subs.push(fn); },

    /** Wurde seit dem letzten Hochladen etwas geändert? */
    isDirty()  { return dirty; },
    clearDirty() { dirty = false; }
  };
})();

/* ===== 20-prices.js ===== */
/* ============================================================
   PREISE – eine gemeinsame Quelle für Monitor und Dashboard
   ============================================================ */
const PRICE = (() => {
  const FUELS     = ['SUP', 'DIE'];
  const FL        = { SUP: 'Super 95', DIE: 'Diesel' };
  const CRIT_JET  = 0.010;    // wir dürfen bis zu 1 Cent über JET liegen
  const CRIT_OMV  = 0.000;    // OMV dürfen wir nicht überschreiten
  const EPS       = 0.0001;
  const STALE_MS  = 20 * 60 * 1000;

  /** "2029" → 2.029 | "1,839" → 1.839 | Unsinn → null */
  function parse(val) {
    if (val === null || val === undefined || val === '') return null;
    const s = String(val).replace(',', '.').trim();
    const n = parseFloat(s);
    if (isNaN(n)) return null;
    if (Number.isInteger(n) && n >= 1000 && n <= 9999) return +(n / 1000).toFixed(3);
    if (n >= 0.5 && n <= 5.0) return +n.toFixed(3);
    return null;
  }

  const fmt = v => (v !== null && v !== undefined) ? Number(v).toFixed(3) + ' €' : '–';

  /** Gültiger OMV-Wert: gemessen, sonst berechnet. */
  const omv = (P, f) => (P['omv_' + f] !== null && P['omv_' + f] !== undefined)
    ? P['omv_' + f] : (P['omv_' + f + '_est'] ?? null);

  const omvIsEstimate = (P, f) =>
    (P['omv_' + f] === null || P['omv_' + f] === undefined) &&
    (P['omv_' + f + '_est'] !== null && P['omv_' + f + '_est'] !== undefined);

  /** OMV aus der Position in der Trefferliste herleiten. */
  function estimateOmv(P, fuel) {
    const eniP   = P['eni_' + fuel];
    const omvPos = P['omv_pos_' + fuel];
    const eniPos = P['eni_pos_' + fuel];
    const pm     = P['pos_price_map_' + fuel] || {};
    if (eniP === null || eniP === undefined) return null;
    if (omvPos === null || omvPos === undefined) return null;
    if (eniPos === null || eniPos === undefined) return null;

    if (omvPos < eniPos) {
      return { price: +(eniP - 0.010).toFixed(3),
               method: 'Pos.' + omvPos + ' vor eni → eni−0,010' };
    }
    let maxP = eniP, maxL = 'eni(Pos.' + eniPos + ')';
    for (let p = eniPos + 1; p < omvPos; p++) {
      if (pm[p] !== null && pm[p] !== undefined && pm[p] > maxP) { maxP = pm[p]; maxL = 'Pos.' + p; }
    }
    return { price: +maxP.toFixed(3), method: 'Pos.' + omvPos + ' hinter eni → ' + maxL };
  }

  /** Eine Sorte prüfen. null, wenn ein Wert fehlt. */
  function checkFuel(P, fuel) {
    const e = P['eni_' + fuel], j = P['jet_' + fuel], o = omv(P, fuel);
    if (e === null || e === undefined) return null;
    if (j === null || j === undefined) return null;
    if (o === null || o === undefined) return null;
    return {
      jetOk: e <= j + CRIT_JET + EPS,
      omvOk: e <= o + CRIT_OMV + EPS,
      need:  e > j + CRIT_JET + EPS || e > o + CRIT_OMV + EPS
    };
  }

  const isPauseTime = (d) => {
    const n = d || new Date();
    const t = n.getHours() * 60 + n.getMinutes();
    return t >= 720 && t < 735;                    // 12:00–12:15
  };

  /* Wann lohnt sich ein Abruf?
     Senkungen sind rund um die Uhr möglich, erhöht werden darf nur um 12:00.
     Ausgesetzt wird deshalb nur dort, wo keine brauchbaren Daten kommen:
       12:00–12:15  Umstellung, der Spritpreisrechner ist abgeschaltet
       22:00–06:00  Nachtruhe
     Sonst durchgehend – damit geht keine Senkung verloren. */
  /**
   * Wann wird abgefragt?
   *   05:00–21:00   ja – die Station ist offen, eine Stunde Vorlauf vor
   *                 Öffnung, damit um 06:00 aktuelle Preise dastehen
   *   12:00–12:15   nein – Umstellung, der Spritpreisrechner ist abgeschaltet
   *   21:00–05:00   nein – Station geschlossen, Preise ohne Belang
   */
  const isFetchTime = (d) => {
    const n = d || new Date();
    const t = n.getHours() * 60 + n.getMinutes();
    if (t >= 720 && t < 735) return false;      // Mittagsumstellung
    return t >= 300 && t < 1260;                // 05:00–21:00
  };

  /* Bestandsname, gleiche Bedeutung – wird vom Panel genutzt. */
  const isOperatingTime = isFetchTime;

  const isStale = (P, nowMs) =>
    !P['_ms'] || ((nowMs || Date.now()) - P['_ms']) > STALE_MS;

  /**
   * Gesamtstatus – bewusst auf drei Zustände beschränkt.
   *
   *   ok      alles vollständig geprüft und im Rahmen
   *   alarm   irgendwo besteht Handlungsbedarf
   *   stale   die Anzeige ist nicht verlässlich (alt, unvollständig, kein Abruf)
   *
   * Keine Nennung einzelner Sorten oder Mitbewerber: Eine Teilangabe verleitet
   * zur Teilmeldung, und eine unvollständige Preismeldung wird vom Zentralrechner
   * verworfen. Gemeldet werden müssen immer alle Mitbewerber und alle Sorten.
   * Die technischen Einzelheiten stehen im Selbsttest, nicht im Betrieb.
   */
  function status(P, opts) {
    opts = opts || {};

    const hasAny = FUELS.some(f =>
      (P['eni_' + f] !== null && P['eni_' + f] !== undefined) ||
      (P['jet_' + f] !== null && P['jet_' + f] !== undefined) ||
      omv(P, f) !== null);

    // Fehlt alles, ist die Anzeige nicht verlässlich – mehr muss niemand wissen.
    if (!hasAny) return { level: 'stale', text: 'Preise nicht aktuell', missing: [] };

    const missing = [];
    let need = false;

    FUELS.forEach(f => {
      const c = checkFuel(P, f);
      if (!c) {
        if (P['eni_' + f] === null || P['eni_' + f] === undefined) missing.push('eni ' + FL[f]);
        if (P['jet_' + f] === null || P['jet_' + f] === undefined) missing.push('JET ' + FL[f]);
        if (omv(P, f) === null)                                    missing.push('OMV ' + FL[f]);
      } else if (c.need) {
        need = true;
      }
    });

    // Handlungsbedarf geht immer vor – auch nachts und bei lückenhaften Daten.
    if (need) {
      return { level: 'alarm', text: 'Handlungsbedarf – Preise im Kassensystem eingeben!', missing };
    }

    // Während der Umstellung sind die Daten unbrauchbar; das ist kein Mangel,
    // aber verlässlich ist die Anzeige trotzdem nicht.
    if (isPauseTime(opts.date)) {
      return { level: 'stale', text: 'Preise nicht aktuell', missing: [] };
    }

    // Lücken oder veraltete Werte laufen auf dieselbe Aussage hinaus:
    // nicht darauf verlassen.
    if (missing.length || isStale(P, opts.nowMs)) {
      return { level: 'stale', text: 'Preise nicht aktuell', missing: missing };
    }

    return { level: 'ok', text: 'Alles in Ordnung', missing: [] };
  }

  return { FUELS, FL, CRIT_JET, CRIT_OMV, parse, fmt, omv, omvIsEstimate,
           estimateOmv, checkFuel, status, isPauseTime, isOperatingTime, isFetchTime, isStale };
})();

/* ===== 30-images.js ===== */
/* ============================================================
   BILDER – Verweise im Text, Daten getrennt
   ------------------------------------------------------------
   Im Anleitungstext steht nur:   <img data-eni-img="name" ...>
   Die eigentlichen Daten liegen in Drive und lokal zwischengespeichert.
   ============================================================ */
const IMGS = (() => {
  const PRE   = 'eni_img_';      // ein localStorage-Schlüssel je Bild
  const IDX   = 'eni_img_index'; // Name -> {fileId, bytes, ts}
  const LIMIT = 4 * 1024 * 1024; // Warnschwelle für den Zwischenspeicher

  let index = {};

  function readIndex() {
    try { index = JSON.parse(localStorage.getItem(IDX) || '{}'); }
    catch (_) { index = {}; }
    return index;
  }
  function writeIndex() {
    try { localStorage.setItem(IDX, JSON.stringify(index)); } catch (_) {}
  }

  return {
    init() { readIndex(); return this; },

    /** Alle bekannten Bildnamen. */
    names() { return Object.keys(index); },

    /** Ist das Bild lokal verfügbar? */
    has(name) {
      try { return !!localStorage.getItem(PRE + name); } catch (_) { return false; }
    },

    /** data-URL aus dem Zwischenspeicher, sonst null. */
    get(name) {
      try { return localStorage.getItem(PRE + name); } catch (_) { return null; }
    },

    /** Bild ablegen. dataUrl = "data:image/png;base64,..." */
    set(name, dataUrl, fileId) {
      try {
        localStorage.setItem(PRE + name, dataUrl);
        index[name] = { fileId: fileId || (index[name] && index[name].fileId) || null,
                        bytes: dataUrl.length, ts: Date.now() };
        writeIndex();
        return true;
      } catch (e) {
        console.warn('[Bilder] Zwischenspeicher voll:', name, e);
        return false;
      }
    },

    /** Zuordnung Name -> Drive-Dateikennung merken (ohne Daten). */
    note(name, fileId) {
      index[name] = Object.assign({}, index[name], { fileId: fileId, ts: Date.now() });
      writeIndex();
    },

    fileId(name) { return index[name] && index[name].fileId; },

    remove(name) {
      try { localStorage.removeItem(PRE + name); } catch (_) {}
      delete index[name]; writeIndex();
    },

    /** Belegter Platz und Warnung. */
    stats() {
      let bytes = 0, n = 0;
      for (const k in index) { if (this.has(k)) { bytes += index[k].bytes || 0; n++; } }
      return { count: n, bytes: bytes, over: bytes > LIMIT };
    },

    /**
     * Alle <img data-eni-img> in einem Element mit Daten füllen.
     * Fehlt ein Bild, bleibt ein dezenter Platzhalter stehen.
     */
    hydrate(root) {
      if (!root) return;
      const list = root.querySelectorAll('img[data-eni-img]');
      for (let i = 0; i < list.length; i++) {
        const el = list[i], name = el.getAttribute('data-eni-img');
        const d = this.get(name);
        if (d) {
          el.src = d;
          el.style.opacity = '';
          el.removeAttribute('data-eni-missing');
        } else if (!el.getAttribute('data-eni-missing')) {
          el.setAttribute('data-eni-missing', '1');
          el.removeAttribute('src');
          el.style.opacity = '.35';
          el.alt = 'Bild wird geladen …';
        }
      }
    },

    /** Bildnamen, die im Text vorkommen, aber lokal fehlen. */
    missingIn(html) {
      const out = [];
      const re = /data-eni-img="([^"]+)"/g;
      let m;
      while ((m = re.exec(html))) { if (!this.has(m[1])) out.push(m[1]); }
      return out;
    }
  };
})();

/* ===== 45-dienstplan.js ===== */
/* ============================================================
   DIENSTPLAN
   ------------------------------------------------------------
   Speicher:  "dp:<jahr>-<monat>"  →  { emps:[Name], eintraege:{ "<name>|<tag>": "<wert>" } }
   Werte:     "6-13" (Minuten seit Mitternacht als Paar), "u", "k" oder ""
   ============================================================ */
const DP = (() => {
  const NAMEN_TAG = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
  const STD_EMPS  = ['Mathias','Bettina','Sylvia','Haval'];

  const key = (j, m) => 'dp:' + j + '-' + String(m).padStart(2, '0');

  /* ---- Zeiterkennung ------------------------------------
     Aus dem, was getippt wird, eine eindeutige Angabe machen.
     Erlaubt: "6 13" · "6,30 13" · "630 1330" · "6.30-13" · "u" · "k"
     Rückgabe: { von, bis } in Minuten, oder { code:'u'|'k' }, oder null. */
  function parse(text) {
    const t = String(text == null ? '' : text).trim().toLowerCase();
    if (!t) return { leer: true };
    if (t === 'u' || t === 'url' || t === 'urlaub')      return { code: 'u' };
    if (t === 'k' || t === 'kr'  || t === 'krank' ||
        t === 'krankenstand')                             return { code: 'k' };

    // Trenner vereinheitlichen: Komma und Doppelpunkt werden zum Punkt
    const norm = t.replace(/,/g, '.').replace(/:/g, '.');
    // Zwei Zeitangaben herausziehen
    const teile = norm.split(/[\s\-–—bis]+/).filter(Boolean);
    if (teile.length !== 2) return null;

    const zeit = (z) => {
      // "6" → 360 · "6.30" → 390 · "630" → 390 · "1330" → 810
      let h, m;
      if (z.indexOf('.') >= 0) {
        const p = z.split('.');
        h = parseInt(p[0], 10);
        m = parseInt((p[1] + '0').slice(0, 2), 10);
      } else if (z.length <= 2) {
        h = parseInt(z, 10); m = 0;
      } else if (z.length === 3) {
        h = parseInt(z.slice(0, 1), 10); m = parseInt(z.slice(1), 10);
      } else if (z.length === 4) {
        h = parseInt(z.slice(0, 2), 10); m = parseInt(z.slice(2), 10);
      } else return null;
      if (isNaN(h) || isNaN(m) || h < 0 || h > 24 || m < 0 || m > 59) return null;
      return h * 60 + m;
    };

    const von = zeit(teile[0]), bis = zeit(teile[1]);
    if (von === null || bis === null) return null;
    if (bis <= von) return null;                 // Nachtschichten kommen nicht vor
    return { von: von, bis: bis };
  }

  /** Gespeicherte Form: "360-780" bzw. "u"/"k". */
  function toStore(p) {
    if (!p || p.leer) return '';
    if (p.code) return p.code;
    return p.von + '-' + p.bis;
  }

  function fromStore(v) {
    const s = String(v || '');
    if (!s) return { leer: true };
    if (s === 'u' || s === 'k') return { code: s };
    const m = /^(\d+)-(\d+)$/.exec(s);
    return m ? { von: +m[1], bis: +m[2] } : null;
  }

  /** Kompakte Anzeige: 6–13 · 6.30–13 · U · K */
  function fmt(v) {
    const p = (typeof v === 'string') ? fromStore(v) : v;
    if (!p || p.leer) return '';
    if (p.code) return p.code === 'u' ? 'U' : 'K';
    const teil = (min) => {
      const h = Math.floor(min / 60), m = min % 60;
      return m ? h + '.' + String(m).padStart(2, '0') : String(h);
    };
    return teil(p.von) + '–' + teil(p.bis);
  }

  /** Stunden eines Eintrags. Urlaub und Krankenstand zählen nicht mit. */
  function stunden(v) {
    const p = (typeof v === 'string') ? fromStore(v) : v;
    if (!p || p.leer || p.code) return 0;
    return (p.bis - p.von) / 60;
  }

  /* ---- Monat lesen und schreiben ------------------------ */
  function monat(j, m) {
    const d = STORE.get(key(j, m));
    if (d) return { emps: (d.emps || []).slice(), eintraege: Object.assign({}, d.eintraege || {}) };
    // Noch nicht angelegt: Mitarbeiter aus dem Vormonat übernehmen
    const vm = m === 1 ? { j: j - 1, m: 12 } : { j: j, m: m - 1 };
    const v = STORE.get(key(vm.j, vm.m));
    return { emps: (v && v.emps && v.emps.length) ? v.emps.slice() : STD_EMPS.slice(),
             eintraege: {} };
  }

  const exists = (j, m) => STORE.has(key(j, m));

  function speichern(j, m, daten) {
    STORE.put(key(j, m), { emps: daten.emps, eintraege: daten.eintraege });
  }

  function setzen(j, m, name, tag, text) {
    const d = monat(j, m);
    const p = parse(text);
    if (p === null) return { ok: false };            // nicht erkannt
    const v = toStore(p);
    const k = name + '|' + tag;
    if (v) d.eintraege[k] = v; else delete d.eintraege[k];
    speichern(j, m, d);
    return { ok: true, wert: v, anzeige: fmt(v) };
  }

  function empHinzu(j, m, name) {
    name = String(name || '').trim();
    if (!name) return false;
    const d = monat(j, m);
    if (d.emps.indexOf(name) >= 0) return false;
    d.emps.push(name);
    speichern(j, m, d);
    return true;
  }

  function empEntfernen(j, m, name) {
    const d = monat(j, m);
    d.emps = d.emps.filter(x => x !== name);
    Object.keys(d.eintraege).forEach(k => {
      if (k.slice(0, k.lastIndexOf('|')) === name) delete d.eintraege[k];
    });
    speichern(j, m, d);
  }

  /** Wie viele Einträge hat ein Mitarbeiter in diesem Monat? */
  function empAnzahl(j, m, name) {
    const d = monat(j, m);
    return Object.keys(d.eintraege).filter(k =>
      k.slice(0, k.lastIndexOf('|')) === name && d.eintraege[k]).length;
  }

  /* ---- Wochenblöcke, Montag bis Sonntag ----------------- */
  /**
   * Wochenblöcke, Montag bis Sonntag – immer sieben Einträge je Block.
   * Angebrochene Wochen werden mit Platzhaltern aufgefüllt, damit jeder
   * Wochentag in jeder Woche dieselbe Spalte behält.
   * Platzhalter: { tag: null, wd: <0..6> }
   */
  function bloecke(j, m) {
    const letzter = new Date(j, m, 0).getDate();
    const out = []; let w = [];
    for (let t = 1; t <= letzter; t++) {
      const wd = (new Date(j, m - 1, t).getDay() + 6) % 7;
      if (wd === 0 && w.length) { out.push(w); w = []; }
      if (!w.length && wd > 0) {
        // Erste Woche beginnt mitten in der Woche: davor auffüllen
        for (let x = 0; x < wd; x++) w.push({ tag: null, wd: x });
      }
      w.push({ tag: t, wd: wd });
    }
    if (w.length) {
      // Letzte Woche bis Sonntag auffüllen
      for (let x = w.length; x < 7; x++) w.push({ tag: null, wd: x });
      out.push(w);
    }
    return out;
  }

  /* ---- Summen ------------------------------------------- */
  function summen(j, m) {
    const d = monat(j, m);
    const out = d.emps.map(n => {
      let h = 0, dienste = 0, url = 0, krank = 0;
      Object.keys(d.eintraege).forEach(k => {
        if (k.slice(0, k.lastIndexOf('|')) !== n) return;
        const v = d.eintraege[k];
        if (v === 'u') { url++; return; }
        if (v === 'k') { krank++; return; }
        const st = stunden(v);
        if (st > 0) { h += st; dienste++; }
      });
      return { name: n, stunden: h, dienste: dienste, urlaub: url, krank: krank };
    });
    out.gesamt = out.reduce((a, x) => a + x.stunden, 0);
    return out;
  }

  const monatsName = (m) => ['Januar','Februar','März','April','Mai','Juni','Juli',
    'August','September','Oktober','November','Dezember'][m - 1];

  return { NAMEN_TAG, parse, toStore, fromStore, fmt, stunden, monat, exists,
           speichern, setzen, empHinzu, empEntfernen, empAnzahl,
           bloecke, summen, monatsName, key };
})();


/* ============================================================
   DRIVE (mobil) – liest und schreibt denselben Ordner wie das
   Dashboard. Ohne Tampermonkey, daher normales fetch.
   ============================================================ */
const DRIVE = (() => {
  const CID    = '175713023932-k95gnmm6g3hgkj1eqoqoag2moo3u552p.apps.googleusercontent.com';
  const SCOPE  = 'https://www.googleapis.com/auth/drive.file';
  const HINT   = 'mathias.venier84@gmail.com';
  const FOLDER = 'Enilive Dashboard';
  const SUBDIR = 'bilder';
  const DATA   = 'daten.json';
  const API    = 'https://www.googleapis.com/drive/v3';
  const UPL    = 'https://www.googleapis.com/upload/drive/v3';
  const POLL   = 60 * 1000;
  const DEBOUNCE = 2000;
  const TKEY   = 'eni_m_token';

  let token = null, tokenExp = 0, client = null;
  let folderId = null, subdirId = null, dataId = null;
  let ready = false, writing = false, pending = false, renewing = false;
  let state = 'offline';
  let writeTimer = null, pollTimer = null, renewTimer = null;
  const hoerer = [];

  const emit = (s, d) => {
    if (s === 'online' || s === 'connecting' || s === 'offline') state = s;
    hoerer.forEach(f => { try { f(s, d); } catch (_) {} });
  };
  const hdr  = () => ({ Authorization: 'Bearer ' + token });
  const jhdr = () => ({ Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' });

  /* Zugang über einen Neustart hinweg merken – am Telefon wird die Seite
     oft aus dem Speicher verdrängt, sonst müsste man ständig neu anmelden. */
  function tokenSichern() {
    try { sessionStorage.setItem(TKEY, JSON.stringify({ t: token, e: tokenExp })); } catch (_) {}
  }
  function tokenLesen() {
    try {
      const d = JSON.parse(sessionStorage.getItem(TKEY) || 'null');
      if (d && d.t && d.e > Date.now() + 60000) { token = d.t; tokenExp = d.e; return true; }
    } catch (_) {}
    return false;
  }

  async function api(pfad, opts) {
    const r = await fetch(API + pfad, Object.assign({ headers: hdr() }, opts || {}));
    if (r.status === 401) { token = null; erneuern(); throw new Error('auth'); }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r;
  }

  async function ordnerSuchen(name, parent) {
    const q = "name='" + name + "' and mimeType='application/vnd.google-apps.folder'" +
              " and trashed=false" + (parent ? " and '" + parent + "' in parents" : '');
    const r = await api('/files?q=' + encodeURIComponent(q) + '&fields=files(id)&pageSize=1');
    const d = await r.json();
    return (d.files && d.files.length) ? d.files[0].id : null;
  }

  async function dateiSuchen(name, parent) {
    const q = "name='" + name + "' and trashed=false and '" + parent + "' in parents";
    const r = await api('/files?q=' + encodeURIComponent(q) + '&fields=files(id)&pageSize=1');
    const d = await r.json();
    return (d.files && d.files.length) ? d.files[0].id : null;
  }

  async function holen() {
    if (!token || !dataId) return 0;
    try {
      const r = await api('/files/' + dataId + '?alt=media');
      const n = STORE.merge(await r.json());
      if (n) emit('daten', n);
      return n;
    } catch (e) { return 0; }
  }

  async function schreiben() {
    if (!token || !ready || !dataId || writing) { pending = true; return; }
    writing = true;
    try {
      await holen();               // Fremdstand nicht überfahren
      STORE.sweep();
      await fetch(UPL + '/files/' + dataId + '?uploadType=media',
        { method: 'PATCH', headers: jhdr(), body: JSON.stringify(STORE.raw()) });
      STORE.clearDirty();
    } catch (e) {
      emit('fehler', e.message);
    } finally {
      writing = false;
      if (pending) { pending = false; planen(); }
    }
  }

  function planen() { clearTimeout(writeTimer); writeTimer = setTimeout(schreiben, DEBOUNCE); }

  /* ---- Bilder: nur lesen, mit lokalem Zwischenspeicher ---- */
  async function bildHolen(name) {
    if (IMGS.has(name)) return IMGS.get(name);
    if (!token || !subdirId) return null;
    try {
      const q = "trashed=false and '" + subdirId + "' in parents and name contains '" + name + "'";
      const r = await api('/files?q=' + encodeURIComponent(q) + '&fields=files(id,name)&pageSize=5');
      const f = (await r.json()).files || [];
      const treffer = f.find(x => x.name.replace(/\.\w+$/, '') === name) || f[0];
      if (!treffer) return null;
      const b = await api('/files/' + treffer.id + '?alt=media');
      const blob = await b.blob();
      const d = await new Promise(res => {
        const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(blob);
      });
      IMGS.set(name, d, treffer.id);
      return d;
    } catch (e) { return null; }
  }

  /* ---- Anmeldung ---- */
  async function aufToken(resp) {
    if (!resp || !resp.access_token) {
      renewing = false;
      emit('offline', resp && resp.error);
      return;
    }
    token = resp.access_token;
    tokenExp = Date.now() + ((resp.expires_in || 3600) - 120) * 1000;
    renewing = false;
    tokenSichern();
    emit('connecting');
    await einrichten();
  }

  async function einrichten() {
    try {
      folderId = await ordnerSuchen(FOLDER, null);
      if (!folderId) { emit('offline', 'Ordner nicht gefunden'); return; }
      subdirId = await ordnerSuchen(SUBDIR, folderId);
      dataId   = await dateiSuchen(DATA, folderId);
      if (!dataId) { emit('offline', 'Datendatei nicht gefunden'); return; }

      await holen();
      ready = true;
      emit('online');

      clearInterval(pollTimer);
      pollTimer = setInterval(() => { if (!document.hidden) holen(); }, POLL);
      clearInterval(renewTimer);
      renewTimer = setInterval(() => {
        if (!token || Date.now() > tokenExp - 5 * 60 * 1000) erneuern();
      }, 60 * 1000);
    } catch (e) {
      emit('offline', e.message);
    }
  }

  function erneuern() {
    if (renewing) return;
    renewing = true;
    emit('connecting');
    verbinden(true);
  }

  function verbinden(still) {
    const los = () => {
      if (!client) {
        client = google.accounts.oauth2.initTokenClient({
          client_id: CID, scope: SCOPE, login_hint: HINT,
          callback: aufToken,
          error_callback: (e) => { renewing = false; emit('offline', e && e.type); }
        });
      }
      client.requestAccessToken({ prompt: still ? '' : 'consent', login_hint: HINT });
    };
    if (window.google && window.google.accounts && window.google.accounts.oauth2) { los(); return; }
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.onload = los;
    s.onerror = () => emit('offline', 'Google nicht erreichbar');
    document.head.appendChild(s);
  }

  return {
    init() {
      STORE.subscribe(() => { if (ready) planen(); });
      const sichern = () => { STORE.flushNow(); if (ready && STORE.isDirty()) schreiben(); };
      window.addEventListener('pagehide', sichern);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) sichern(); else if (ready) holen();
      });
      if (tokenLesen()) { emit('connecting'); einrichten(); }
      else verbinden(true);
      return this;
    },
    istOnline() { return ready && !!token; },
    zustand()  { return renewing ? 'connecting' : state; },
    neuVerbinden() { verbinden(false); },
    holen, bildHolen,
    aufZustand(f) { hoerer.push(f); }
  };
})();


/* ============================================================
   OBERFLÄCHE (mobil)
   ============================================================ */
const APP = (() => {
  const DS  = ['Mo','Di','Mi','Do','Fr','Sa','So'];
  const DSL = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];

  const esc = s => String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') +
                   '-' + String(d.getDate()).padStart(2,'0');
  const dow = d => (d.getDay() + 6) % 7;
  const heuteISO = () => iso(new Date());
  const tageBis = ds => {
    const t = new Date(); t.setHours(0,0,0,0);
    return Math.ceil((new Date(ds) - t) / 864e5);
  };

  const REITER = [
    { id:'heute',  ic:'⛽', lb:'Heute' },
    { id:'plan',   ic:'📅', lb:'Plan' },
    { id:'liste',  ic:'✓',  lb:'Listen' },
    { id:'dienst', ic:'👥', lb:'Dienst' },
    { id:'anl',    ic:'📖', lb:'Anleitung' }
  ];

  let aktiv = 'heute';
  let planTag = 1;                 // 0 = gestern, 1 = heute
  let dpJahr = 0, dpMonat = 0;
  let alOffen = null, alSuche = '';
  let mhdAlle = false;

  /* ---- Bausteine ---- */
  function kopf() {
    const z = DRIVE.zustand();
    const txt = z === 'offline' ? '○ getrennt' : '● verbunden';
    return `<div class="kopf">
      <div>
        <h1>Enilive Station Venier</h1>
        <div class="dat">${new Date().toLocaleDateString('de-AT',
          { weekday:'long', day:'2-digit', month:'long' })}</div>
      </div>
      <button class="sync${z==='offline'?' off':''}" onclick="APP.verbinden()">${txt}</button>
    </div>`;
  }

  function fuss() {
    return `<nav class="fuss">${REITER.map(r =>
      `<button class="${r.id===aktiv?'aktiv':''}" onclick="APP.zeige('${r.id}')">
        <span class="ic">${r.ic}</span><span class="lb">${r.lb}</span></button>`).join('')}</nav>`;
  }

  /* ---- Preise ---- */
  function preise() {
    const P = STORE.get('prices', {}) || {};
    const st = PRICE.status(P);
    const cls  = { alarm:'s-warn', stale:'s-inc', ok:'s-ok' }[st.level] || 's-inc';
    const icon = { alarm:'⚠ ',     stale:'⏰ ',    ok:'✓ '  }[st.level] || '';

    const karte = (name, adr, s, d, mine) => `<div class="pr${mine?' mine':''}">
      <div class="pr-n">${esc(name)}<small>${esc(adr)}</small></div>
      <div class="pr-z"><span>Super 95</span><b>${s!=null?s.toFixed(3)+' €':'–'}</b></div>
      <div class="pr-z"><span>Diesel</span><b>${d!=null?d.toFixed(3)+' €':'–'}</b></div>
    </div>`;

    return `<div class="karte">
      <div class="kt">Spritpreise<span class="neb">${P._ts ? 'Stand '+esc(P._ts) : ''}</span></div>
      <div class="sbox ${cls}">${icon}${esc(st.text)}</div>
      ${karte('eni','Bundesstraße 4', P.eni_SUP, P.eni_DIE, true)}
      ${karte('JET','Industriezone 33', P.jet_SUP, P.jet_DIE)}
      ${karte('OMV Gutmann','Langgasse 91', PRICE.omv(P,'SUP'), PRICE.omv(P,'DIE'))}
    </div>`;
  }

  /* ---- Heute ---- */
  function seiteHeute() {
    const ds = heuteISO(), wd = dow(new Date());
    const fix = STORE.list('week').filter(x => x.day === wd);
    const cal = STORE.list('cal').filter(x => x.date === ds);
    const offen = STORE.list('todo').filter(x => !x.done);
    const mhd = STORE.list('mhd').filter(x => !x.done)
      .sort((a,b) => new Date(a.date) - new Date(b.date)).slice(0,4);
    const farbe = n => n<=0?'#ef4444':n<=3?'#f97316':n<=7?'#eab308':'#22c55e';
    const wann = n => n<0 ? Math.abs(n)+' Tage überfällig'
                    : n===0 ? 'Heute!' : n===1 ? 'Morgen' : 'in '+n+' Tagen';

    const heute = [...fix, ...cal];
    return preise() + `
    <div class="karte">
      <div class="kt">Heute</div>
      ${heute.length ? heute.map(x => `<div class="we"><div class="we-t">${esc(x.text)}</div></div>`).join('')
        : '<div class="leer">Nichts eingetragen</div>'}
    </div>
    <div class="karte">
      <div class="kt">Offene Aufgaben<span class="neb">${offen.length||''}</span></div>
      ${offen.length ? offen.map(t => `<div class="z">
        <button class="z-chk" onclick="APP.todoTog('${t._key}')"></button>
        <div class="z-txt">${esc(t.text)}</div></div>`).join('')
        : '<div class="leer">Alles erledigt</div>'}
    </div>
    <div class="karte">
      <div class="kt">MHD als Nächstes</div>
      ${mhd.length ? mhd.map(m => { const n = tageBis(m.date); return `<div class="z">
        <div class="punkt" style="background:${farbe(n)}"></div>
        <div class="z-txt">${esc(m.name)}</div>
        <div class="z-info">${wann(n)}</div></div>`; }).join('')
        : '<div class="leer">Keine Einträge</div>'}
    </div>`;
  }

  /* ---- Wochenplan: ein Tag ---- */
  function planTage() {
    const t = new Date(); t.setHours(0,0,0,0);
    const s = new Date(t); s.setDate(t.getDate() - 1);
    return Array.from({length:7}, (_,i) => { const d = new Date(s); d.setDate(s.getDate()+i); return d; });
  }

  function seitePlan() {
    const tage = planTage();
    const fix = STORE.list('week'), cal = STORE.list('cal');
    const leiste = tage.map((d,i) => {
      const ds = iso(d), wd = dow(d);
      const hat = fix.some(x => x.day === wd) || cal.some(x => x.date === ds);
      return `<button class="${i===planTag?'an':''}" onclick="APP.planZu(${i})">
        <span class="tl-d">${DS[wd]}</span>
        <span class="tl-n">${String(d.getDate()).padStart(2,'0')}</span>
        <span class="tl-p${hat?'':' aus'}"></span></button>`;
    }).join('');
    return `<div class="karte">
      <div class="kt">Wochenplan</div>
      <div class="tl">${leiste}</div>
      <div class="tag-buehne" id="buehne">${tagKarte(tage[planTag])}</div>
      <div class="wisch">Wischen oder antippen zum Wechseln</div>
    </div>`;
  }

  function tagKarte(d) {
    const ds = iso(d), wd = dow(d), ist = ds === heuteISO();
    const fix = STORE.list('week').filter(x => x.day === wd);
    const cal = STORE.list('cal').filter(x => x.date === ds);
    const zeilen = (liste) => liste.length
      ? liste.map(x => `<div class="we">
          <div class="we-t">${esc(x.text)}</div>
          <button class="we-d" onclick="APP.wkDel('${x._key}')">×</button></div>`).join('')
      : '<div class="we"><div class="we-t" style="color:var(--tl)">–</div></div>';
    return `<div class="tag-gross${ist?' heute':''}">
      <div class="tag-k">${ist?'▶ ':''}${DSL[wd]}
        <span>${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}</span></div>
      <div class="tag-i">
        <div class="zone-t">Fix</div>
        ${zeilen(fix)}
        <button class="plus" onclick="APP.wkNeu('fix',${wd},'')">+ hinzufügen</button>
        <div class="zone-t cal">Termine</div>
        ${zeilen(cal)}
        <button class="plus" onclick="APP.wkNeu('cal',0,'${ds}')">+ hinzufügen</button>
      </div></div>`;
  }

  /* ---- Listen ---- */
  function seiteListe() {
    const todos = STORE.list('todo');
    const offen = todos.filter(x => !x.done), erledigt = todos.filter(x => x.done);
    const mhdAktiv = STORE.list('mhd').filter(x => !x.done)
      .sort((a,b) => new Date(a.date) - new Date(b.date));
    const mhdFertig = STORE.list('mhd').filter(x => x.done);
    const farbe = n => n<=0?'#ef4444':n<=3?'#f97316':n<=7?'#eab308':'#22c55e';
    const wann = n => n<0 ? Math.abs(n)+'d überfällig' : n===0 ? 'Heute!' : n===1 ? 'Morgen' : 'in '+n+'d';

    const zeileT = t => `<div class="z">
      <button class="z-chk${t.done?' on':''}" onclick="APP.todoTog('${t._key}')">${t.done?'✓':''}</button>
      <div class="z-txt${t.done?' done':''}">${esc(t.text)}</div>
      <button class="z-del" onclick="APP.todoDel('${t._key}')">×</button></div>`;

    return `<div class="karte">
      <div class="kt">Aufgaben<span class="neb">${offen.length} offen</span></div>
      ${offen.map(zeileT).join('')}
      ${erledigt.map(zeileT).join('')}
      ${!todos.length ? '<div class="leer">Keine Aufgaben</div>' : ''}
      <div class="eing">
        <input id="todo-neu" placeholder="Neue Aufgabe"
          onkeydown="if(event.key==='Enter')APP.todoAdd()">
        <button onclick="APP.todoAdd()">+</button>
      </div>
    </div>
    <div class="karte">
      <div class="kt">MHD-Liste<span class="neb">${mhdAktiv.length}</span></div>
      ${mhdAktiv.map(m => { const n = tageBis(m.date); return `<div class="z">
        <div class="punkt" style="background:${farbe(n)}"></div>
        <div class="z-txt">${esc(m.name)}</div>
        <div class="z-info">${wann(n)}</div>
        <button class="z-chk" onclick="APP.mhdTog('${m._key}')"></button></div>`; }).join('')}
      ${!mhdAktiv.length ? '<div class="leer">Keine Einträge</div>' : ''}
      ${mhdAlle ? mhdFertig.map(m => `<div class="z" style="opacity:.45">
        <div class="punkt" style="background:#22c55e"></div>
        <div class="z-txt done">${esc(m.name)}</div>
        <button class="z-chk on" onclick="APP.mhdTog('${m._key}')">↩</button></div>`).join('') : ''}
      <div class="eing">
        <input id="mhd-n" placeholder="Produkt">
        <input id="mhd-d" type="date">
        <button onclick="APP.mhdAdd()">+</button>
      </div>
      ${mhdFertig.length ? `<button class="plus" style="margin-top:8px"
        onclick="APP.mhdAlle()">${mhdAlle?'Erledigte ausblenden':'Erledigte zeigen ('+mhdFertig.length+')'}</button>` : ''}
    </div>`;
  }

  /* ---- Dienstplan ---- */
  function seiteDienst() {
    if (!dpJahr) { const n = new Date(); dpJahr = n.getFullYear(); dpMonat = n.getMonth()+1; }
    const d = DP.monat(dpJahr, dpMonat);
    const letzter = new Date(dpJahr, dpMonat, 0).getDate();
    const heute = new Date();
    const istMonat = heute.getFullYear() === dpJahr && heute.getMonth()+1 === dpMonat;

    let zeilen = '';
    for (let t = 1; t <= letzter; t++) {
      const dt = new Date(dpJahr, dpMonat-1, t);
      const eintraege = d.emps.map(n => ({ n: n, v: d.eintraege[n + '|' + t] || '' }))
                              .filter(x => x.v);
      const ist = istMonat && heute.getDate() === t;
      zeilen += `<div class="dp-tag${ist?' heute':''}">
        <div class="dp-d">${DS[dow(dt)]} ${String(t).padStart(2,'0')}.
          <small>${String(dpMonat).padStart(2,'0')}.${String(dpJahr).slice(2)}</small></div>
        <div class="dp-s">${eintraege.length
          ? eintraege.map(x => `<div class="dp-e${(x.v==='u'||x.v==='k')?' abw':''}">
              <b>${esc(x.n)}</b><span>${DP.fmt(x.v)}</span></div>`).join('')
          : '<div class="dp-frei">keine Dienste</div>'}</div></div>`;
    }

    const leer = !Object.keys(d.eintraege).length;
    return `<div class="karte">
      <div class="dp-nav">
        <button onclick="APP.dpBlatt(-1)">‹</button>
        <span class="dp-mon">${DP.monatsName(dpMonat)} ${dpJahr}</span>
        <button onclick="APP.dpBlatt(1)">›</button>
      </div>
      ${leer ? '<div class="leer">Für diesen Monat ist noch nichts erfasst.</div>' : zeilen}
      <div style="font-size:12.5px;color:var(--t3);text-align:center;margin-top:12px">
        Bearbeiten am Rechner unter #dp</div>
    </div>`;
  }

  /* ---- Anleitungen ---- */
  function seiteAnl() {
    if (alOffen) return anlDetail(alOffen);
    const alle = STORE.list('anl').map(a => Object.assign({ id: a._id }, a));
    const t = alSuche.trim().toLowerCase();
    const treffer = t
      ? alle.filter(a => a.title.toLowerCase().indexOf(t) >= 0 ||
          String(a.content||'').replace(/<[^>]*>/g,' ').toLowerCase().indexOf(t) >= 0)
      : alle;
    const cats = [...new Set(treffer.map(a => a.cat))];
    return `<div class="karte">
      <div class="kt">Anleitungen<span class="neb">${alle.length}</span></div>
      <input class="al-suche" placeholder="Durchsuchen …" value="${esc(alSuche)}"
        oninput="APP.anlSuche(this.value)">
      ${treffer.length ? cats.map(c => `
        <div class="zone-t" style="margin:14px 0 2px">${esc(c)}</div>
        ${treffer.filter(a => a.cat === c).map(a => `<div class="al-l" onclick="APP.anlAuf('${esc(a.id)}')">
          <div class="al-l-t">${esc(a.title)}</div><div class="al-pfeil">›</div></div>`).join('')}
      `).join('') : '<div class="leer">Keine Treffer</div>'}
    </div>`;
  }

  function anlDetail(id) {
    const a = STORE.get('anl:' + id);
    if (!a) { alOffen = null; return seiteAnl(); }
    return `<div class="karte">
      <button class="zurueck" onclick="APP.anlZu()">‹ Zurück</button>
      <div class="al-inhalt" id="al-inhalt">${a.content || ''}</div>
    </div>`;
  }

  /* ---- Aufbau ---- */
  function seite(id) {
    return id === 'heute'  ? seiteHeute()
         : id === 'plan'   ? seitePlan()
         : id === 'liste'  ? seiteListe()
         : id === 'dienst' ? seiteDienst()
         : seiteAnl();
  }

  /* Wird gerade getippt? Dann kein Neuaufbau – sonst verschwindet der Text. */
  function tippt() {
    const a = document.activeElement;
    if (!a) return false;
    const t = a.tagName;
    return t === 'INPUT' || t === 'TEXTAREA' || a.isContentEditable;
  }

  let bauWartet = false;
  function bauen() {
    if (tippt()) {
      if (!bauWartet) {
        bauWartet = true;
        const w = () => setTimeout(() => {
          if (tippt()) return;
          document.removeEventListener('focusout', w, true);
          bauWartet = false; bauen();
        }, 0);
        document.addEventListener('focusout', w, true);
      }
      return;
    }
    document.getElementById('app').innerHTML = kopf() + '<div id="inhalt">' +
      seite(aktiv) + '</div>' + fuss();
    if (aktiv === 'plan') wischen();
    if (aktiv === 'anl' && alOffen) bilderNachladen();
  }

  /* Bilder in einer geöffneten Anleitung nachladen */
  async function bilderNachladen() {
    const box = document.getElementById('al-inhalt');
    if (!box) return;
    IMGS.hydrate(box);
    const fehlend = [];
    box.querySelectorAll('img[data-eni-img]').forEach(el => {
      const n = el.getAttribute('data-eni-img');
      if (!IMGS.has(n)) fehlend.push(n);
    });
    for (const n of fehlend) {
      const d = await DRIVE.bildHolen(n);
      if (d) {
        const el = box.querySelector('img[data-eni-img="' + n + '"]');
        if (el) { el.src = d; el.style.opacity = ''; }
      }
    }
  }

  /* Wischen: nur waagrecht blättern, senkrecht bleibt Scrollen */
  function wischen() {
    const el = document.getElementById('buehne');
    if (!el) return;
    let x0 = 0, y0 = 0, an = false;
    el.addEventListener('touchstart', e => {
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; an = true;
    }, { passive: true });
    el.addEventListener('touchend', e => {
      if (!an) return; an = false;
      const dx = e.changedTouches[0].clientX - x0;
      const dy = e.changedTouches[0].clientY - y0;
      if (Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
      APP.planZu(planTag + (dx < 0 ? 1 : -1));
    }, { passive: true });
  }

  return {
    start() {
      STORE.init(); IMGS.init();
      STORE.subscribe(() => bauen());
      DRIVE.aufZustand(() => bauen());
      DRIVE.init();
      bauen();
    },

    zeige(id) { aktiv = id; alOffen = null; bauen(); window.scrollTo(0,0); },
    verbinden() { DRIVE.neuVerbinden(); },

    planZu(i) { planTag = Math.max(0, Math.min(6, i)); bauen(); },

    wkNeu(art, wd, ds) {
      const t = prompt(art === 'fix' ? 'Feste Aufgabe:' : 'Termin:');
      if (!t || !t.trim()) return;
      if (art === 'fix') STORE.add('week', { day: wd, text: t.trim() });
      else               STORE.add('cal',  { date: ds, text: t.trim() });
    },
    wkDel(k) { if (confirm('Eintrag entfernen?')) STORE.del(k); },

    todoAdd() {
      const el = document.getElementById('todo-neu');
      if (!el || !el.value.trim()) return;
      STORE.add('todo', { text: el.value.trim(), done: false });
      el.value = '';
    },
    todoTog(k) { const v = STORE.get(k); if (v) STORE.put(k, Object.assign({}, v, { done: !v.done })); },
    todoDel(k) { STORE.del(k); },

    mhdAdd() {
      const n = document.getElementById('mhd-n'), d = document.getElementById('mhd-d');
      if (!n || !d || !n.value.trim() || !d.value) return;
      STORE.add('mhd', { name: n.value.trim(), date: d.value, done: false });
      n.value = ''; d.value = '';
    },
    mhdTog(k) { const v = STORE.get(k); if (v) STORE.put(k, Object.assign({}, v, { done: !v.done })); },
    mhdAlle() { mhdAlle = !mhdAlle; bauen(); },

    dpBlatt(r) {
      dpMonat += r;
      if (dpMonat > 12) { dpMonat = 1; dpJahr++; }
      if (dpMonat < 1)  { dpMonat = 12; dpJahr--; }
      bauen();
    },

    anlAuf(id) { alOffen = id; bauen(); window.scrollTo(0,0); },
    anlZu()    { alOffen = null; bauen(); },
    anlSuche(v){ alSuche = v; const el = document.getElementById('inhalt');
                 if (el) el.innerHTML = seiteAnl(); },

    _: { get STORE(){return STORE}, get DRIVE(){return DRIVE}, get DP(){return DP},
         get PRICE(){return PRICE}, get IMGS(){return IMGS},
         seite, bauen, planTage, get planTag(){return planTag} }
  };
})();


window.APP = APP;
if (document.readyState === 'loading')
  document.addEventListener('DOMContentLoaded', () => APP.start());
else APP.start();
})();
</script>
</body>
