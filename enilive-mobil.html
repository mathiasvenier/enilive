  function neu(kunde, kz, notiz) {
    const l = alle();
    const pos = l.length ? (l[l.length-1].pos || 0) + 10 : 10;
    return STORE.add('vign', { kunde: String(kunde||'').trim(),
                               kz: String(kz||'').trim(),
                               notiz: String(notiz||'').trim(),
                               jahre: {}, pos: pos });
  }

  const weg = k => STORE.del(k);

  /** Was ist im laufenden Jahr noch offen? */
  function offen(jahr) {
    jahr = jahr || new Date().getFullYear();
    const o = { nichtAktiviert: [], nichtFakturiert: [] };
    alle().forEach(v => {
      const e = (v.jahre || {})[jahr];
      if (!e || !e.a) o.nichtAktiviert.push(v);
      else if (e.a === 'a' && !e.f) o.nichtFakturiert.push(v);
    });
    return o;
  }

  return { START, ersteinrichtung, alle, nachKunde, jahre, schalten,
           setzNotiz, neu, weg, offen };
})();

/* ===== 49-erinnerung.js ===== */
/* ============================================================
   ERINNERUNGEN – Meldungen zu festen Zeiten
   ------------------------------------------------------------
   Bewusst keine Browser-Benachrichtigungen: Die brauchen eine
   Erlaubnis, verschwinden im Rauschen des Betriebssystems und
   lassen sich wegwischen, ohne dass etwas geschieht. Für eine
   Sache, die verbindlich sein soll, ist das die schwächste Form.

   Stattdessen eine Meldung oben im Dashboard, die bleibt, bis
   sie bestätigt ist. Kein Schließen-Kreuz.

   Aufbau:
     "erin:<id>"  → { text, zeit, tage, frist, aktiv, pos }
       text  – was zu tun ist
       zeit  – "20:00", ab wann die Meldung erscheint
       tage  – [0..6] ab Montag; leer heißt täglich
       frist – Minuten bis „überfällig"
       aktiv – ausgeschaltete Erinnerungen bleiben stehen
     "erinq:<id>_<datum>" → { erin, ts, wer }   bestätigt

   Die Bestätigung trägt das Datum im Schlüssel. Dadurch kann
   dieselbe Erinnerung an jedem Tag erneut fällig werden, und
   zwei Geräte, die gleichzeitig bestätigen, schreiben in
   denselben Eintrag statt zwei anzulegen.
   ============================================================ */
const ERIN = (() => {
  const START = [
    ['Außenbeleuchtung eingeschaltet?', '19:30', 60],
    ['Außenbeleuchtung ausgeschaltet?', '07:00', 60]
  ];

  /* Station geschlossen 21:00–06:00. Eine Erinnerung außerhalb dieser
     Zeit kann niemand bestätigen, deshalb wird sie gar nicht angeboten. */
  const FRUEH = 6 * 60, SPAET = 21 * 60;

  const minuten = (z) => {
    const m = /^(\d{1,2})[:.](\d{2})$/.exec(String(z || '').trim());
    if (!m) return null;
    const h = +m[1], mi = +m[2];
    if (h > 23 || mi > 59) return null;
    return h * 60 + mi;
  };

  const alsZeit = (min) =>
    String(Math.floor(min / 60)).padStart(2, '0') + ':' +
    String(min % 60).padStart(2, '0');

  /** Liegt die Zeit innerhalb der Öffnungszeit? */
  const imBetrieb = (min) => min !== null && min >= FRUEH && min <= SPAET;

  function ersteinrichtung() {
    if (STORE.has('erin_init')) return 0;
    let n = 0;
    START.forEach((e, i) => {
      const k = 'erin:start_' + i;
      if (!STORE.raw().items[k]) {
        STORE.seed(k, { text: e[0], zeit: e[1], tage: [], frist: e[2],
                        aktiv: true, pos: (i + 1) * 10 });
        n++;
      }
    });
    STORE.seed('erin_init', new Date().toISOString());
    return n;
  }

  const alle = () => STORE.list('erin')
    .sort((a, b) => (a.pos || 0) - (b.pos || 0));

  function neu(text, zeit, frist) {
    text = String(text || '').trim();
    if (!text || minuten(zeit) === null) return null;
    const l = alle();
    const pos = l.length ? (l[l.length - 1].pos || 0) + 10 : 10;
    return STORE.add('erin', { text: text, zeit: zeit, tage: [],
                               frist: +frist || 60, aktiv: true, pos: pos });
  }

  function aendern(key, teil) {
    const e = STORE.get(key);
    if (!e) return false;
    if (teil.zeit !== undefined && minuten(teil.zeit) === null) return false;
    STORE.put(key, Object.assign({}, e, teil, { _key: undefined }));
    return true;
  }

  const weg = k => STORE.del(k);

  function schieben(key, r) {
    const l = alle();
    const i = l.findIndex(x => x._key === key), j = i + r;
    if (i < 0 || j < 0 || j >= l.length) return false;
    const a = l[i], b = l[j];
    STORE.put(a._key, Object.assign({}, a, { pos: b.pos, _key: undefined }));
    STORE.put(b._key, Object.assign({}, b, { pos: a.pos, _key: undefined }));
    return true;
  }

  /* Tagesschlüssel als reine Zahlenfolge, damit er über Zeitzonen und
     Spracheinstellungen hinweg gleich bleibt. */
  const tagKey = (d) => d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');

  const quittKey = (key, d) =>
    'erinq:' + String(key).replace('erin:', '') + '_' + tagKey(d || new Date());

  const bestaetigt = (key, d) => {
    const q = STORE.get(quittKey(key, d));
    return q || null;
  };

  /** Bestätigen. Ohne Nachfrage, wie beim Abhaken der Aufgaben. */
  function bestaetigen(key, wer) {
    const e = STORE.get(key);
    if (!e) return null;
    const jetzt = new Date();
    if (bestaetigt(key, jetzt)) return null;      // schon quittiert
    const eintrag = { erin: key, ts: Date.now(),
                      wer: String(wer || TASKS.diensthabend() || '') };
    STORE.put(quittKey(key, jetzt), eintrag);
    PROT.schreiben('erinnerung', e.text, eintrag.wer, key);
    return eintrag;
  }

  /** Gilt die Erinnerung an diesem Wochentag? Leere Liste heißt täglich. */
  function amTag(e, d) {
    if (!e.tage || !e.tage.length) return true;
    const wd = (d.getDay() + 6) % 7;              // 0 = Montag
    return e.tage.indexOf(wd) >= 0;
  }

  /**
   * Was ist gerade offen? Liefert die fälligen, noch nicht bestätigten
   * Erinnerungen – überfällige zuerst.
   */
  function offen(jetzt) {
    const d = jetzt || new Date();
    const nun = d.getHours() * 60 + d.getMinutes();
    return alle()
      .filter(e => e.aktiv !== false)
      .filter(e => amTag(e, d))
      .map(e => {
        const ab = minuten(e.zeit);
        if (ab === null || nun < ab) return null;
        if (bestaetigt(e._key, d)) return null;
        const seit = nun - ab;
        return Object.assign({}, e, {
          seit: seit,
          ueberfaellig: seit >= (+e.frist || 60)
        });
      })
      .filter(Boolean)
      .sort((a, b) => (b.ueberfaellig - a.ueberfaellig) || (b.seit - a.seit));
  }

  return { START, ersteinrichtung, alle, neu, aendern, weg, schieben,
           bestaetigen, bestaetigt, offen, amTag, minuten, alsZeit,
           imBetrieb, FRUEH, SPAET };
})();

/* ===== m40-drive.js ===== */
/* ============================================================
   DRIVE (mobil) – derselbe Ordner wie das Dashboard
   ------------------------------------------------------------
   Unterschiede zur Fassung im Dashboard:
     · normales fetch, kein GM_xmlhttpRequest
     · keine Bilder, kein Browsersymbol – beides braucht die
       mobile Seite nicht
     · der Zugang wird über einen Neustart hinweg gemerkt: am
       Telefon wird die Seite oft aus dem Speicher verdrängt,
       sonst müsste man ständig neu anmelden
     · es wird nichts angelegt. Fehlt der Ordner oder die Datei,
       heißt das: das Dashboard war noch nie verbunden. Dann
       hier still bleiben statt einen zweiten Ordner anzulegen,
       in dem die Daten dann getrennt auseinanderlaufen.
   ============================================================ */
const DRIVE = (() => {
  const CID    = '175713023932-k95gnmm6g3hgkj1eqoqoag2moo3u552p.apps.googleusercontent.com';
  const SCOPE  = 'https://www.googleapis.com/auth/drive.file';
  const HINT   = 'mathias.venier84@gmail.com';
  const FOLDER = 'Enilive Dashboard';
  const DATA   = 'daten.json';
  const API    = 'https://www.googleapis.com/drive/v3';
  const UPL    = 'https://www.googleapis.com/upload/drive/v3';
  const POLL   = 60 * 1000;
  const DEBOUNCE = 2500;
  const TKEY   = 'eni_m_token';

  let token = null, tokenExp = 0, client = null;
  let folderId = null, dataId = null;
  let ready = false, writing = false, pending = false, renewing = false;
  let state = 'offline', grund = '';
  let writeTimer = null, pollTimer = null, renewTimer = null;
  const hoerer = [];

  const emit = (s, d) => {
    if (s === 'online' || s === 'connecting' || s === 'offline') state = s;
    if (s === 'offline' && d) grund = String(d);
    if (s === 'online') grund = '';
    hoerer.forEach(f => { try { f(s, d); } catch (_) {} });
  };

  const hdr  = () => ({ Authorization: 'Bearer ' + token });
  const jhdr = () => ({ Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' });

  /* Zugang merken. sessionStorage, nicht localStorage: Der Zugang gehört
     in diese Sitzung und soll nicht dauerhaft auf dem Gerät liegen. */
  function tokenSichern() {
    try { sessionStorage.setItem(TKEY, JSON.stringify({ t: token, e: tokenExp })); } catch (_) {}
  }
  function tokenLesen() {
    try {
      const d = JSON.parse(sessionStorage.getItem(TKEY) || 'null');
      if (d && d.t && d.e > Date.now() + 60000) { token = d.t; tokenExp = d.e; return true; }
    } catch (_) {}
    return false;
  }

  async function api(pfad, opts) {
    const r = await fetch(API + pfad, Object.assign({ headers: hdr() }, opts || {}));
    if (r.status === 401) { token = null; erneuern(); throw new Error('auth'); }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r;
  }

  async function suchen(q) {
    const r = await api('/files?q=' + encodeURIComponent(q) + '&fields=files(id)&pageSize=1');
    const d = await r.json();
    return (d.files && d.files.length) ? d.files[0].id : null;
  }

  /** Lesen und einmischen. Der lokale Stand bleibt, wo er neuer ist. */
  async function holen() {
    if (!token || !dataId) return 0;
    try {
      const r = await api('/files/' + dataId + '?alt=media');
      const n = STORE.merge(await r.json());
      if (n) emit('daten', n);
      return n;
    } catch (e) {
      if (String(e.message) !== 'auth') emit('fehler', e.message);
      return 0;
    }
  }

  /** Schreiben – immer erst den Fremdstand einmischen, nie überfahren. */
  async function schreiben() {
    if (!token || !ready || !dataId || writing) { pending = true; return; }
    writing = true;
    try {
      await holen();
      STORE.sweep();
      const r = await fetch(UPL + '/files/' + dataId + '?uploadType=media',
        { method: 'PATCH', headers: jhdr(), body: JSON.stringify(STORE.raw()) });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      STORE.clearDirty();
      emit('gesichert');
    } catch (e) {
      emit('fehler', e.message);
    } finally {
      writing = false;
      if (pending) { pending = false; planen(); }
    }
  }

  function planen() { clearTimeout(writeTimer); writeTimer = setTimeout(schreiben, DEBOUNCE); }

  async function einrichten() {
    try {
      folderId = await suchen("name='" + FOLDER + "' and mimeType='application/vnd.google-apps.folder'" +
                              " and trashed=false");
      if (!folderId) { emit('offline', 'Ordner „' + FOLDER + '“ nicht gefunden'); return; }
      dataId = await suchen("name='" + DATA + "' and trashed=false and '" + folderId + "' in parents");
      if (!dataId) { emit('offline', DATA + ' nicht gefunden'); return; }

      await holen();
      ready = true;
      emit('online');

      clearInterval(pollTimer);
      pollTimer = setInterval(() => { if (!document.hidden) holen(); }, POLL);

      /* Eigener Takt für die Berechtigung: Sie läuft nach etwa einer Stunde
         ab. Ohne stille Erneuerung stünde die Seite dann auf „getrennt“,
         obwohl nichts fehlt außer einem neuen Zugang. */
      clearInterval(renewTimer);
      renewTimer = setInterval(() => {
        if (!token || Date.now() > tokenExp - 5 * 60 * 1000) erneuern();
      }, 60 * 1000);
    } catch (e) {
      emit('offline', e.message);
    }
  }

  async function aufToken(resp) {
    if (!resp || !resp.access_token) {
      renewing = false;
      emit('offline', (resp && resp.error) || 'Anmeldung abgebrochen');
      return;
    }
    token = resp.access_token;
    tokenExp = Date.now() + ((resp.expires_in || 3600) - 120) * 1000;
    renewing = false;
    tokenSichern();
    emit('connecting');
    await einrichten();
  }

  function erneuern() {
    if (renewing) return;
    renewing = true;
    emit('connecting');
    verbinden(true);
  }

  /* Das Google-Anmeldeskript MUSS geladen sein, bevor getippt wird: Safari
     unterdrückt Anmeldefenster, die nicht unmittelbar aus einem Fingertipp
     entstehen. Lädt das Skript erst beim Tippen nach, ist die Geste
     verbraucht, bis es da ist – und das Fenster wird blockiert. */
  let gsiLaeuft = null;
  function gsiBereit() {
    return !!(window.google && window.google.accounts && window.google.accounts.oauth2);
  }
  function gsiLaden() {
    if (gsiBereit()) return Promise.resolve(true);
    if (gsiLaeuft) return gsiLaeuft;
    gsiLaeuft = new Promise(fertig => {
      const s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client';
      s.async = true;
      s.onload  = () => fertig(true);
      s.onerror = () => { emit('offline', 'Google nicht erreichbar'); fertig(false); };
      document.head.appendChild(s);
    });
    return gsiLaeuft;
  }

  function verbinden(still) {
    const los = () => {
      if (!client) {
        client = google.accounts.oauth2.initTokenClient({
          client_id: CID, scope: SCOPE, login_hint: HINT,
          callback: aufToken,
          error_callback: (e) => { renewing = false; emit('offline', (e && e.type) || 'abgebrochen'); }
        });
      }
      client.requestAccessToken({ prompt: still ? '' : 'consent', login_hint: HINT });
    };
    if (gsiBereit()) { los(); return; }
    if (!still) emit('offline', 'Anmeldung wird vorbereitet – bitte gleich noch einmal tippen');
    gsiLaden().then(da => { if (da && !still) los(); else if (da && still) los(); });
  }

  return {
    init() {
      STORE.subscribe(() => { if (ready) planen(); });
      const sichern = () => {
        STORE.flushNow();
        if (!ready || !STORE.isDirty()) return;
        clearTimeout(writeTimer);
        schreiben();
      };
      /* pagehide statt beforeunload: Safari am iPhone löst beforeunload
         beim Wegblenden nicht zuverlässig aus. */
      window.addEventListener('pagehide', sichern);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) sichern(); else if (ready) holen();
      });

      gsiLaden();
      if (tokenLesen()) { emit('connecting'); einrichten(); }
      else verbinden(true);
      return this;
    },
    istOnline() { return ready && !!token; },
    zustand()   { return renewing ? 'connecting' : state; },
    grund()     { return grund; },
    neuVerbinden() { verbinden(false); },
    holen, schreiben,
    /** Bei jedem Zustandswechsel benachrichtigen (Anzeige neu aufbauen). */
    aufZustand(f) { hoerer.push(f); }
  };
})();

/* ===== m45-feed.js ===== */
/* ============================================================
   PREISABRUF (mobil)
   ------------------------------------------------------------
   Ob die mobile Seite die Preise selbst holen darf, entscheidet
   der Browser: Die Schnittstelle liegt auf einer fremden
   Herkunft, und ob sie das erlaubt, ist nichts, was sich hier
   vorhersagen ließe. Deshalb wird es versucht statt behauptet.

   Geht es, stehen am Telefon eigene, aktuelle Werte.
   Geht es nicht, bleibt der Stand aus Drive – und der Status
   sagt von selbst, dass er nicht aktuell ist. Falsche Preise
   entstehen dabei nicht: Bei einem Fehlschlag wird nichts
   geschrieben.

   Ausgewertet wird mit AUSW, also mit denselben Regeln wie am
   Rechner. Eine zweite Fassung dieser Regeln gibt es nicht.
   ============================================================ */
const MFEED = (() => {
  const HOST  = 'https://www.spritpreisrechner.at';
  const PATH  = '/api/search/gas-stations/by-address';
  const LAT   = 47.235275;
  const LON   = 10.739235;
  const TAKT  = 5 * 60 * 1000;        // während die Seite offen ist
  const NEUER_VERSUCH = 30 * 60 * 1000; // nach einem Fehlschlag

  let moeglich = null;      // null = unbekannt, true/false = geprüft
  let laeuft   = false;
  let letzter  = 0;         // Zeitpunkt des letzten Versuchs
  let hinweis  = '';
  const wachen = [];
  const sagen  = () => wachen.forEach(f => { try { f(); } catch (_) {} });

  /** Adresse für eine Sorte. Die vom Dashboard mitgeschnittene hat Vorrang. */
  function adresse(fuel) {
    const gesehen = STORE.get('api_url', null);
    let url;
    if (gesehen && /fuelType=/.test(gesehen)) {
      url = String(gesehen).replace(/fuelType=[A-Z]+/, 'fuelType=' + fuel);
    } else {
      url = HOST + PATH + '?latitude=' + LAT + '&longitude=' + LON + '&fuelType=' + fuel;
    }
    if (url.indexOf('http') !== 0) url = HOST + (url.charAt(0) === '/' ? '' : '/') + url;
    /* Geschlossene Stationen müssen mit. Nachts hat nur JET offen – ohne
       diesen Zusatz fehlen eni und OMV in der Antwort, und das sähe aus
       wie „aus dem Ranking gefallen“. Der mitgeschnittene Aufruf trägt den
       Schalterzustand der Webseite und ist deshalb nicht verlässlich. */
    url = url.replace(/[?&]includeClosed=(true|false)/i, '');
    return url + (url.indexOf('?') >= 0 ? '&' : '?') + 'includeClosed=true';
  }

  async function eineSorte(fuel) {
    const r = await fetch(adresse(fuel), { credentials: 'omit', mode: 'cors' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (!Array.isArray(d)) throw new Error('unerwartete Antwort');
    return d;
  }

  /**
   * Beide Sorten holen und auswerten. Geschrieben wird erst, wenn beide
   * da sind: Ein halber Stand wäre schlimmer als der alte, weil er
   * vollständig aussieht.
   */
  async function abrufen(vonHand) {
    if (laeuft) return false;
    if (moeglich === false && !vonHand && Date.now() - letzter < NEUER_VERSUCH) return false;
    if (!vonHand && !PRICE.isFetchTime()) return false;

    laeuft = true; letzter = Date.now(); sagen();
    try {
      const listen = {};
      for (const f of PRICE.FUELS) listen[f] = await eineSorte(f);

      const P = STORE.get('prices', {}) || {};
      for (const f of PRICE.FUELS) AUSW.auswerten(P, listen[f], f);
      STORE.put('prices', P);

      moeglich = true; hinweis = '';
      return true;
    } catch (e) {
      moeglich = false;
      hinweis = String(e && e.message || e);
      return false;
    } finally {
      laeuft = false; sagen();
    }
  }

  return {
    start() {
      abrufen(false);
      setInterval(() => { if (!document.hidden) abrufen(false); }, TAKT);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) abrufen(false); });
      return this;
    },
    abrufen,
    /** Auskunft für die Anzeige. */
    bericht() { return { moeglich: moeglich, laeuft: laeuft, letzter: letzter, hinweis: hinweis }; },
    aufAenderung(f) { wachen.push(f); }
  };
})();

/* ===== m70-mobil-app.js ===== */
/* ============================================================
   OBERFLÄCHE (mobil)
   ------------------------------------------------------------
   Fünf Reiter. Alles, was bestätigt oder abgehakt wird, liegt
   unter „Heute“ – das ist der Bildschirm, der im Betrieb offen
   ist. Die Fachlogik kommt unverändert aus den Modulen des
   Dashboards; hier steht nur, wie sie am Telefon aussieht.
   ============================================================ */
const APP = (() => {
  const DS  = ['Mo','Di','Mi','Do','Fr','Sa','So'];
  const DSL = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
  const QUITTUNG = 1100;

  const esc = s => String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

  const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') +
                   '-' + String(d.getDate()).padStart(2,'0');
  const dow = d => (d.getDay() + 6) % 7;
  const heuteISO = () => iso(new Date());

  const REITER = [
    { id:'heute', ic:'⛽', lb:'Heute' },
    { id:'plan',  ic:'📅', lb:'Plan' },
    { id:'dienst',ic:'👥', lb:'Dienst' },
    { id:'notiz', ic:'✎',  lb:'Notizen' },
    { id:'prot',  ic:'📖', lb:'Protokoll' }
  ];

  let aktiv     = 'heute';
  let planTag   = 1;          // 0 = gestern, 1 = heute
  let dpVersatz = 0;          // Wochen vor oder zurück
  let protArt   = '';
  let tkEdit    = false;      // Aufgaben bearbeiten
  let erEdit    = false;      // Erinnerungen bearbeiten
  let notizOk   = 0;

  /* ---- Kopf ---------------------------------------------- */
  function kopf() {
    const z = DRIVE.zustand();
    const txt = z === 'offline' ? '○ getrennt' : '● verbunden';
    const g = (z === 'offline') ? DRIVE.grund() : '';
    return `<div class="kopf">
      <div>
        <h1>Enilive Station Venier</h1>
        <div class="dat">${esc(new Date().toLocaleDateString('de-AT',
          { weekday:'long', day:'2-digit', month:'long', year:'numeric' }))}</div>
      </div>
      <button class="sync${z === 'offline' ? ' off' : ''}"
        onclick="APP.verbinden()">${txt}</button>
    </div>
    ${g ? `<div class="kopf-grund">${esc(g)}</div>` : ''}`;
  }

  function fuss() {
    const offen = ERIN.offen().length;
    return `<nav class="fuss">${REITER.map(r =>
      `<button class="${r.id === aktiv ? 'an' : ''}" onclick="APP.zeige('${r.id}')">
        <span class="ic">${r.ic}${(r.id === 'heute' && offen) ? '<span class="pkt"></span>' : ''}</span>
        <span class="lb">${r.lb}</span></button>`).join('')}</nav>`;
  }

  /* ---- Erinnerungen: Meldung ----------------------------- */
  /* Ganz oben, ohne Schließen-Kreuz: Sie verschwindet nur durch
     Bestätigen. Überfällige zuerst und rot. */
  function erinBanner() {
    const l = ERIN.offen();
    if (!l.length) return '';
    return l.map(e => `<div class="er${e.ueberfaellig ? ' er-spaet' : ''}">
      <div class="er-t">
        <div class="er-x">${esc(e.text)}</div>
        <div class="er-z">seit ${esc(e.zeit)}${e.ueberfaellig ? ' · überfällig' : ''}</div>
      </div>
      <button class="er-ok" onclick="APP.erinOk('${e._key}')">Erledigt</button>
    </div>`).join('');
  }

  /* ---- Preise -------------------------------------------- */
  function preise() {
    const P = STORE.get('prices', {}) || {};
    const st = PRICE.status(P);
    /* warn nutzt denselben Orangeton wie „nicht aktuell“: beides heißt
       hinsehen, aber nicht sofort handeln. */
    const cls  = { alarm:'s-warn', stale:'s-inc', warn:'s-inc', ok:'s-ok' }[st.level] || 's-inc';
    const icon = { alarm:'⚠ ',     stale:'⏰ ',    warn:'⚠ ',    ok:'✓ '  }[st.level] || '';

    /* Fehlt ein Preis, wird nichts angezeigt. Ein alter Wert wäre schlimmer
       als gar keiner: Er sieht gültig aus und verleitet zu einer falschen
       Meldung. */
    const karte = (name, adr, s, d, tagS, tagD, mine, outS, outD) => {
      const wert = (v, out) => v != null
        ? `<span class="sp-p">${PRICE.fmt(v)}</span>`
        : `<span class="sp-p na">${out ? 'nicht gelistet' : '–'}</span>`;
      return `<div class="sp${mine ? ' mine' : ''}">
        <div class="sp-n">${esc(name)}${mine ? '<span class="sp-b">Meine Station</span>' : ''}</div>
        <div class="sp-a">${esc(adr)}</div>
        <div class="sp-r"><span class="sp-f">Super 95</span>${wert(s, outS)}</div>
        ${tagS ? `<span class="sp-tag">${esc(tagS)}</span>` : ''}
        <div class="sp-r"><span class="sp-f">Diesel</span>${wert(d, outD)}</div>
        ${tagD ? `<span class="sp-tag">${esc(tagD)}</span>` : ''}
      </div>`;
    };

    const fb = MFEED.bericht();
    return `<div class="karte">
      <div class="kt">Spritpreise
        <span class="neb">Stand: ${esc(P._ts || '–')}</span>
        <button class="akt" onclick="APP.preiseJetzt()"${fb.laeuft ? ' disabled' : ''}>↻ Jetzt</button>
      </div>
      ${`<div class="s-box ${cls}">${icon}${esc(st.text)}</div>`}
      ${karte('OMV Gutmann','Langgasse 91a', PRICE.omv(P,'SUP'), PRICE.omv(P,'DIE'),
              PRICE.omvIsGuess(P,'SUP') ? 'geschätzt' : (PRICE.omvIsEstimate(P,'SUP') ? 'berechnet' : ''),
              PRICE.omvIsGuess(P,'DIE') ? 'geschätzt' : (PRICE.omvIsEstimate(P,'DIE') ? 'berechnet' : ''),
              false)}
      ${karte('JET','Industriezone 33', P.jet_SUP, P.jet_DIE, '', '', false)}
      ${karte('eni','Bundesstraße 4', P.eni_SUP, P.eni_DIE, '', '', true,
              PRICE.eniOut(P,'SUP'), PRICE.eniOut(P,'DIE'))}
    </div>`;
  }

  /* ---- Tägliche Aufgaben --------------------------------- */
  function aufgaben() {
    const items = TASKS.alle();
    const jetzt = Date.now();
    const zeit = ts => {
      const d = new Date(ts);
      const h = new Date(); h.setHours(0,0,0,0);
      const t = new Date(ts); t.setHours(0,0,0,0);
      const uhr = d.toLocaleTimeString('de-AT',{ hour:'2-digit', minute:'2-digit' });
      return (+t === +h) ? uhr
        : d.toLocaleDateString('de-AT',{ day:'2-digit', month:'2-digit' }) + ' ' + uhr;
    };

    const zeilen = items.map((t, i) => {
      if (tkEdit) return `<div class="z">
        <div class="z-t">
          <textarea class="feld" rows="1" oninput="APP.wachsen(this)"
            onchange="APP.tkText('${t._key}',this.value)">${esc(t.text)}</textarea>
          <div class="z-n">${t.einmalig ? 'einmalig' : 'täglich'}</div>
        </div>
        <button class="z-x" onclick="APP.tkSchieb('${t._key}',-1)"${i === 0 ? ' disabled' : ''}>↑</button>
        <button class="z-x" onclick="APP.tkSchieb('${t._key}',1)"${i === items.length-1 ? ' disabled' : ''}>↓</button>
        <button class="z-x" onclick="APP.tkWeg('${t._key}')">×</button>
      </div>`;
      const frisch = t.ts && (jetzt - t.ts) < QUITTUNG;
      return `<div class="tk${t.einmalig ? ' tk-e' : ''}">
        <button class="tk-b${frisch ? ' quitt' : ''}"
          onclick="APP.tkHaken('${t._key}')">${frisch ? '✓' : ''}</button>
        <span class="tk-t">${esc(t.text)}${
          t.einmalig ? '<span class="tk-einm">einmalig</span>' : ''}</span>
        <span class="tk-z">${(t.ts && !frisch) ? esc(zeit(t.ts)) : ''}</span>
      </div>`;
    }).join('');

    return `<div class="karte">
      <div class="kt">Tägliche Aufgaben
        <button class="akt" onclick="APP.tkEdit()">${tkEdit ? 'fertig' : 'bearbeiten'}</button>
      </div>
      ${zeilen || '<div class="leer">Keine Aufgaben hinterlegt</div>'}
      ${tkEdit ? `<textarea class="feld" id="tk-neu" rows="1" placeholder="Neue Aufgabe"
        oninput="APP.wachsen(this)" style="margin-top:11px"></textarea>
      <div class="neu">
        <button onclick="APP.tkNeu(false)">+ täglich</button>
        <button class="zweit" onclick="APP.tkNeu(true)">+ einmalig</button>
      </div>` : ''}
    </div>`;
  }

  /* ---- Erinnerungen bearbeiten --------------------------- */
  function erinnerungen() {
    if (!erEdit) return `<div class="karte">
      <div class="kt">Erinnerungen
        <button class="akt" onclick="APP.erEdit()">bearbeiten</button></div>
      <div class="leer">${ERIN.alle().length} eingetragen</div>
    </div>`;

    const l = ERIN.alle();
    const zeilen = l.map(e => `<div class="eb${e.aktiv === false ? ' aus' : ''}">
      <div class="eb-k">
        <textarea class="feld" rows="1" oninput="APP.wachsen(this)"
          onchange="APP.erSetz('${e._key}','text',this.value)">${esc(e.text)}</textarea>
      </div>
      <div class="eb-r">
        <label>ab <input type="text" value="${esc(e.zeit)}"
          onchange="APP.erSetz('${e._key}','zeit',this.value)"></label>
        <label>Frist <input type="text" value="${e.frist || 60}"
          onchange="APP.erSetz('${e._key}','frist',this.value)"> Min</label>
        <label><input type="checkbox"${e.aktiv === false ? '' : ' checked'}
          onchange="APP.erSetz('${e._key}','aktiv',this.checked)"> aktiv</label>
      </div>
      <div class="eb-tage">${DS.map((w, n) => `<button class="${
          (e.tage && e.tage.indexOf(n) >= 0) ? 'an' : ''}"
        onclick="APP.erTag('${e._key}',${n})">${w}</button>`).join('')}</div>
      <div class="eb-akt">
        <span style="font-size:12px;color:var(--t3)">${
          (e.tage && e.tage.length) ? 'nur an den gewählten Tagen' : 'täglich'}</span>
        <button class="eb-weg" onclick="APP.erWeg('${e._key}')">entfernen</button>
      </div>
    </div>`).join('');

    return `<div class="karte">
      <div class="kt">Erinnerungen
        <button class="akt" onclick="APP.erEdit()">fertig</button></div>
      <p style="font-size:13px;color:var(--t3);line-height:1.5;margin-bottom:11px">
        Die Meldung erscheint ab der eingetragenen Zeit oben und bleibt, bis
        jemand bestätigt. Nach Ablauf der Frist wird sie rot. Ohne gewählten
        Wochentag gilt sie täglich. Zeiten außerhalb von
        ${ERIN.alsZeit(ERIN.FRUEH)}–${ERIN.alsZeit(ERIN.SPAET)} sind nicht
        möglich – dann ist niemand da, der bestätigen könnte.</p>
      ${zeilen || '<div class="leer">Keine Erinnerungen</div>'}
      <div class="eing">
        <input id="er-text" placeholder="Neue Meldung">
        <input id="er-zeit" placeholder="20:00" style="flex:0 0 88px;text-align:center">
        <button onclick="APP.erNeu()">+</button>
      </div>
    </div>`;
  }

  const seiteHeute = () => erinBanner() + preise() + aufgaben() + erinnerungen();

  /* ---- Wochenplan ---------------------------------------- */
  /* Rollendes Fenster: gestern, heute, dann fünf Tage voraus. Heute steht
     an zweiter Stelle, der Vortag daneben bleibt zur Kontrolle sichtbar. */
  function planTage() {
    const t = new Date(); t.setHours(0,0,0,0);
    const s = new Date(t); s.setDate(t.getDate() - 1);
    return Array.from({ length:7 }, (_, i) => {
      const d = new Date(s); d.setDate(s.getDate() + i); return d;
    });
  }

  function tagKarte(d) {
    const ds = iso(d), wd = dow(d), ist = ds === heuteISO();
    const fix = STORE.list('week').filter(x => x.day === wd);
    const cal = STORE.list('cal').filter(x => x.date === ds);
    const zeilen = liste => liste.length
      ? liste.map(x => `<div class="we">
          <div class="we-t">${esc(x.text)}</div>
          <button class="we-x" onclick="APP.wkWeg('${x._key}')">×</button></div>`).join('')
      : '<div class="we"><div class="we-t" style="color:var(--tl)">–</div></div>';
    return `<div class="tag${ist ? ' heute' : ''}">
      <div class="tag-k">${ist ? '▶ ' : ''}${DSL[wd]}
        <span>${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}</span></div>
      <div class="tag-i">
        <div class="zone">Fix</div>
        ${zeilen(fix)}
        <button class="plus" onclick="APP.wkNeu('fix',${wd},'')">+ hinzufügen</button>
        <div class="zone cal">Termine</div>
        ${zeilen(cal)}
        <button class="plus" onclick="APP.wkNeu('cal',0,'${ds}')">+ hinzufügen</button>
      </div></div>`;
  }

  function seitePlan() {
    const tage = planTage();
    const fix = STORE.list('week'), cal = STORE.list('cal');
    const leiste = tage.map((d, i) => {
      const ds = iso(d), wd = dow(d);
      const hat = fix.some(x => x.day === wd) || cal.some(x => x.date === ds);
      return `<button class="${i === planTag ? 'an' : ''}" onclick="APP.planZu(${i})">
        <span class="tl-d">${DS[wd]}</span>
        <span class="tl-n">${String(d.getDate()).padStart(2,'0')}</span>
        <span class="tl-p${hat ? '' : ' aus'}"></span></button>`;
    }).join('');
    return `<div class="karte">
      <div class="kt">Wochenplan</div>
      <div class="tl">${leiste}</div>
      <div class="buehne" id="buehne">${tagKarte(tage[planTag])}</div>
      <div class="wisch">Wischen oder antippen zum Wechseln</div>
    </div>`;
  }

  /* ---- Dienstplan ---------------------------------------- */
  /* Nur ansehen. Bearbeitet wird am Rechner: Die Kurzschreibweise ist auf
     eine Tastatur ausgelegt, nicht auf einen Daumen. */
  function wocheAb(versatz) {
    const t = new Date(); t.setHours(0,0,0,0);
    const mo = new Date(t); mo.setDate(t.getDate() - dow(t) + versatz * 7);
    return Array.from({ length:7 }, (_, i) => {
      const d = new Date(mo); d.setDate(mo.getDate() + i); return d;
    });
  }

  function dienste(d) {
    const m = DP.monat(d.getFullYear(), d.getMonth() + 1);
    return m.emps.map(n => ({ n: n, v: m.eintraege[n + '|' + d.getDate()] || '' }))
                 .filter(x => x.v);
  }

  function seiteDienst() {
    const tage = wocheAb(dpVersatz);
    const heute = new Date(); heute.setHours(0,0,0,0);
    const hs = iso(heute);

    const jetzt = TASKS.diensthabend();
    const heuteListe = dienste(heute);

    const zeilen = tage.map(d => {
      const l = dienste(d);
      const ist = iso(d) === hs;
      return `<div class="dp-t${ist ? ' heute' : ''}">
        <div class="dp-d">${DS[dow(d)]} ${String(d.getDate()).padStart(2,'0')}.
          <small>${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getFullYear()).slice(2)}</small></div>
        <div class="dp-s">${l.length
          ? l.map(x => `<div class="dp-e${(x.v === 'u' || x.v === 'k') ? ' abw' : ''}">
              <b>${esc(x.n)}</b><span>${esc(DP.fmt(x.v))}</span></div>`).join('')
          : '<div class="dp-frei">keine Dienste</div>'}</div></div>`;
    }).join('');

    const von = tage[0], bis = tage[6];
    const spanne = String(von.getDate()).padStart(2,'0') + '.' +
      String(von.getMonth()+1).padStart(2,'0') + '. – ' +
      String(bis.getDate()).padStart(2,'0') + '.' +
      String(bis.getMonth()+1).padStart(2,'0') + '.';

    return `<div class="karte">
      <div class="dp-heute">
        <div class="kt">Heute im Dienst</div>
        ${heuteListe.length
          ? heuteListe.map(x => `<div class="dp-e${(x.v === 'u' || x.v === 'k') ? ' abw' : ''}">
              <b>${esc(x.n)}</b><span>${esc(DP.fmt(x.v))}</span></div>`).join('')
          : '<div class="dp-frei">keine Dienste eingetragen</div>'}
        ${jetzt ? `<div style="font-size:13px;color:var(--t3);margin-top:6px">gerade an der Kassa: ${esc(jetzt)}</div>` : ''}
      </div>
      <div class="dp-nav">
        <button onclick="APP.dpBlatt(-1)">‹</button>
        <span class="dp-w">${dpVersatz === 0 ? 'Diese Woche' : spanne}</span>
        <button onclick="APP.dpBlatt(1)">›</button>
      </div>
      ${zeilen}
      <div style="font-size:12.5px;color:var(--t3);text-align:center;margin-top:12px">
        Bearbeitet wird der Dienstplan am Rechner.</div>
    </div>`;
  }

  /* ---- Notizen ------------------------------------------- */
  function seiteNotiz() {
    const l = STORE.list('notiz').sort((a, b) => (b.ts || 0) - (a.ts || 0));
    return `<div class="karte">
      <div class="kt">Notizen<span class="neb">${l.length}</span></div>
      ${l.length ? l.map(n => {
        const d = n.ts ? new Date(n.ts) : null;
        return `<div class="z">
          <div class="z-t">${esc(n.text)}
            <div class="z-n">${d ? esc(d.toLocaleDateString('de-AT',
              { day:'2-digit', month:'2-digit', year:'2-digit' }) + ' · ' +
              d.toLocaleTimeString('de-AT', { hour:'2-digit', minute:'2-digit' })) : ''}</div>
          </div>
          <button class="z-x" onclick="APP.notizWeg('${n._key}')">×</button>
        </div>`; }).join('') : '<div class="leer">Keine Notizen</div>'}
      <div class="eing">
        <input id="nz-neu" placeholder="Notiz eingeben">
        <button onclick="APP.notizNeu()">+</button>
      </div>
      <div class="ok-hinweis">${(Date.now() - notizOk < 3000) ? 'Notiz gespeichert' : ''}</div>
    </div>`;
  }

  /* ---- Protokoll ----------------------------------------- */
  function seiteProt() {
    const arten = PROT.arten();
    const tage = PROT.nachTagen(300, protArt || null);
    return `<div class="karte">
      <div class="kt">Protokoll</div>
      <div class="pf">
        <button class="${protArt ? '' : 'an'}" onclick="APP.protFilter('')">Alles</button>
        ${arten.map(a => `<button class="${protArt === a ? 'an' : ''}"
          onclick="APP.protFilter('${esc(a)}')">${esc(PROT.artName(a))}</button>`).join('')}
      </div>
      ${tage.length ? tage.map(t => `<div class="pr-tag">${esc(t.tag)}</div>
        ${t.items.map(x => `<div class="pr-z">
          <span class="pr-u">${esc(new Date(x.ts).toLocaleTimeString('de-AT',
            { hour:'2-digit', minute:'2-digit' }))}</span>
          <span class="pr-a">${esc(PROT.artName(x.art))}</span>
          <span class="pr-w">${esc(x.was)}</span>
          <span class="pr-p">${esc(x.wer || '')}</span>
        </div>`).join('')}`).join('')
        : '<div class="leer">Noch nichts protokolliert</div>'}
    </div>`;
  }

  /* ---- Aufbau -------------------------------------------- */
  const seite = id => id === 'heute'  ? seiteHeute()
                    : id === 'plan'   ? seitePlan()
                    : id === 'dienst' ? seiteDienst()
                    : id === 'notiz'  ? seiteNotiz()
                    :                   seiteProt();

  /* Wird gerade getippt? Dann kein Neuaufbau – sonst verschwindet der Text. */
  function tippt() {
    const a = document.activeElement;
    if (!a) return false;
    const t = a.tagName;
    return t === 'INPUT' || t === 'TEXTAREA' || a.isContentEditable;
  }

  let bauWartet = false, letzteAnsicht = null;
  function bauen() {
    if (tippt()) {
      if (!bauWartet) {
        bauWartet = true;
        const w = () => setTimeout(() => {
          if (tippt()) return;
          document.removeEventListener('focusout', w, true);
          bauWartet = false; bauen();
        }, 0);
        document.addEventListener('focusout', w, true);
      }
      return;
    }
    /* Wird dieselbe Ansicht neu gebaut, bleibt die Stelle stehen, an der
       gerade gearbeitet wird. Ohne das springt jedes Abhaken nach oben. */
    const gleich = letzteAnsicht === aktiv;
    const y = window.scrollY;
    document.getElementById('app').innerHTML = kopf() + seite(aktiv) + fuss();
    letzteAnsicht = aktiv;
    document.querySelectorAll('textarea.feld').forEach(hoehe);
    if (gleich) window.scrollTo(0, y);
    if (aktiv === 'plan') wischen();
  }

  /* Ein Textfeld auf die Höhe seines Inhalts bringen. Ohne das steht in
     einem einzeiligen Feld nur der Anfang – man bearbeitet dann etwas,
     das man nicht sieht. */
  function hoehe(el) {
    if (!el) return;
    el.style.height = 'auto';
    el.style.height = (el.scrollHeight + 2) + 'px';
  }

  /* Wischen: nur waagrecht blättern, senkrecht bleibt Scrollen. */
  function wischen() {
    const el = document.getElementById('buehne');
    if (!el) return;
    let x0 = 0, y0 = 0, an = false;
    el.addEventListener('touchstart', e => {
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; an = true;
    }, { passive: true });
    el.addEventListener('touchend', e => {
      if (!an) return; an = false;
      const dx = e.changedTouches[0].clientX - x0;
      const dy = e.changedTouches[0].clientY - y0;
      if (Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
      APP.planZu(planTag + (dx < 0 ? 1 : -1));
    }, { passive: true });
  }

  /* Zeiten außerhalb der Öffnungszeit ablehnen: Eine Meldung um 23 Uhr
     kann niemand bestätigen und stünde am Morgen als überfällig da. */
  function pruefZeit(z) {
    const m = ERIN.minuten(z);
    if (m === null) { alert('Zeit bitte als 20:00 eintragen.'); return false; }
    if (!ERIN.imBetrieb(m)) {
      alert('Nur zwischen ' + ERIN.alsZeit(ERIN.FRUEH) + ' und ' + ERIN.alsZeit(ERIN.SPAET) +
            ' – sonst ist niemand da, der bestätigen kann.');
      return false;
    }
    return true;
  }

  return {
    start() {
      STORE.init();
      /* Keine Ersteinrichtung. Der Bestand kommt aus Drive; würde die
         mobile Seite selbst welchen anlegen, käme Gelöschtes zurück. */
      STORE.subscribe(bauen);
      DRIVE.aufZustand(bauen);
      MFEED.aufAenderung(bauen);
      DRIVE.init();
      MFEED.start();
      bauen();
      /* Der Tag wechselt, während die Seite offen liegt – und mit ihm,
         was fällig ist. Einmal pro Minute reicht dafür. */
      setInterval(bauen, 60000);
    },

    zeige(id) { aktiv = id; window.scrollTo(0, 0); bauen(); },
    wachsen(el) { hoehe(el); },
    verbinden() { DRIVE.neuVerbinden(); },
    preiseJetzt() { MFEED.abrufen(true); bauen(); },

    /* Erinnerungen */
    erinOk(k) { ERIN.bestaetigen(k); },
    erEdit()  { erEdit = !erEdit; bauen(); },
    erSetz(k, feld, wert) {
      if (feld === 'zeit' && !pruefZeit(wert)) { bauen(); return; }
      if (feld === 'frist') wert = Math.max(1, parseInt(wert, 10) || 60);
      ERIN.aendern(k, { [feld]: wert });
    },
    erTag(k, n) {
      const e = STORE.get(k); if (!e) return;
      const t = (e.tage || []).slice();
      const i = t.indexOf(n);
      if (i >= 0) t.splice(i, 1); else t.push(n);
      ERIN.aendern(k, { tage: t.sort() });
    },
    erWeg(k) { if (confirm('Erinnerung entfernen?')) ERIN.weg(k); },
    erNeu() {
      const t = document.getElementById('er-text'), z = document.getElementById('er-zeit');
      if (!t || !z || !t.value.trim()) return;
      if (!pruefZeit(z.value)) return;
      ERIN.neu(t.value.trim(), z.value.trim(), 60);
      t.value = ''; z.value = '';
      bauen();
    },

    /* Tägliche Aufgaben */
    tkHaken(k) { TASKS.haken(k); setTimeout(bauen, QUITTUNG + 60); },
    tkEdit()   { tkEdit = !tkEdit; bauen(); },
    tkText(k, v) {
      const t = STORE.get(k);
      if (!t || !String(v).trim()) return;
      STORE.put(k, Object.assign({}, t, { text: String(v).trim(), _key: undefined }));
    },
    tkSchieb(k, r) { TASKS.schieben(k, r); },
    tkWeg(k) { if (confirm('Aufgabe entfernen?')) TASKS.weg(k); },
    tkNeu(einmalig) {
      const el = document.getElementById('tk-neu');
      if (!el || !el.value.trim()) return;
      TASKS.neu(el.value.trim(), einmalig);
      el.value = '';
      bauen();
    },

    /* Wochenplan */
    planZu(i) { planTag = Math.max(0, Math.min(6, i)); bauen(); },
    wkNeu(art, wd, ds) {
      const t = prompt(art === 'fix' ? 'Feste Aufgabe:' : 'Termin:');
      if (!t || !t.trim()) return;
      if (art === 'fix') STORE.add('week', { day: wd, text: t.trim() });
      else               STORE.add('cal',  { date: ds, text: t.trim() });
    },
    wkWeg(k) { if (confirm('Eintrag entfernen?')) STORE.del(k); },

    /* Dienstplan */
    dpBlatt(r) { dpVersatz += r; bauen(); },

    /* Notizen */
    notizNeu() {
      const el = document.getElementById('nz-neu');
      if (!el || !el.value.trim()) return;
      STORE.add('notiz', { text: el.value.trim(), ts: Date.now() });
      el.value = '';
      notizOk = Date.now();
      bauen();
      setTimeout(() => { notizOk = 0; bauen(); }, 3200);
    },
    notizWeg(k) { if (confirm('Notiz entfernen?')) STORE.del(k); },

    /* Protokoll */
    protFilter(a) { protArt = a; bauen(); },

    /* Für Tests */
    _: { get STORE() { return STORE; }, get DRIVE() { return DRIVE; },
         get MFEED() { return MFEED; }, get PRICE() { return PRICE; },
         get AUSW() { return AUSW; }, get ERIN() { return ERIN; },
         get TASKS() { return TASKS; }, get PROT() { return PROT; },
         get DP() { return DP; },
         seite, bauen, planTage, wocheAb,
         get aktiv() { return aktiv; }, get planTag() { return planTag; } }
  };
})();

window.APP = APP;
if (document.readyState === 'loading')
  document.addEventListener('DOMContentLoaded', () => APP.start());
else APP.start();

})();
</script>
</body>
</html>
