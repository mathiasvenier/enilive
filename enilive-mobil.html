<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Enilive">
<meta name="theme-color" content="#007BA9">
<meta name="robots" content="noindex,nofollow">
<title>Enilive Station Venier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
/* ============================================================
   GESTALTUNG (mobil)
   Dieselben Farben und dieselbe Lesbarkeitsskala wie am Rechner.
   Keine Bildschirmschrift unter 11 px, alles über 4,5:1 Kontrast.
   Grundschrift 16 px – am Telefon vergrößert Safari sonst beim
   Antippen jedes Eingabefeld.
   ============================================================ */
:root{
  --t1:#2c3338;--t2:#4a5a63;--t3:#616f78;--tl:#93a1a8;
  --eni:#007BA9;--eni2:#0DB4E6;
  --rot:#a51b1b;--gruen:#15803d;--gelb:#92400e;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Montserrat',system-ui,-apple-system,sans-serif;
  font-size:16px;color:var(--t1);
  background:radial-gradient(circle at 72% 18%,#0DB4E6 0%,#007BA9 42%,#008582 100%);
  background-attachment:fixed;
  min-height:100vh;min-height:100dvh;
  padding:env(safe-area-inset-top) 0 calc(66px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}

/* ---- Kopf ---------------------------------------------- */
.kopf{padding:12px 14px 10px;display:flex;align-items:flex-start;
  justify-content:space-between;gap:10px}
.kopf h1{font-size:17px;font-weight:700;color:#fff;letter-spacing:-.2px;line-height:1.25}
.kopf .dat{font-size:13px;color:rgba(255,255,255,.85);font-weight:500;margin-top:3px}
.sync{font-size:12px;font-weight:600;padding:9px 13px;border-radius:20px;
  background:rgba(255,255,255,.2);color:#fff;border:none;font-family:inherit;
  white-space:nowrap;cursor:pointer;flex-shrink:0}
.sync.off{background:rgba(255,120,120,.4)}
.kopf-grund{font-size:12px;color:rgba(255,255,255,.9);padding:0 14px 10px;line-height:1.4}

/* ---- Karten -------------------------------------------- */
.karte{background:rgba(255,255,255,.97);border-radius:14px;margin:0 10px 10px;
  padding:14px 15px 13px}
.kt{font-size:12.5px;font-weight:700;color:var(--t2);text-transform:uppercase;
  letter-spacing:1.1px;margin-bottom:11px;display:flex;justify-content:space-between;
  align-items:baseline;gap:8px}
.kt .neb{font-weight:500;color:var(--t3);letter-spacing:0;text-transform:none;
  font-size:11.5px;white-space:nowrap}
.kt .akt{text-transform:none;letter-spacing:0;font-weight:600;font-size:12.5px;
  color:var(--eni);background:none;border:1px solid #cfe9f5;border-radius:6px;
  padding:3px 10px;font-family:inherit;flex-shrink:0}
.kt .akt[disabled]{opacity:.5}
.leer{font-size:14.5px;color:var(--t3);padding:12px 0;text-align:center}

/* ---- Erinnerungen -------------------------------------- */
.er{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;
  border-left:5px solid var(--eni2);box-shadow:0 1px 4px rgba(0,0,0,.13);
  padding:12px 13px;margin:0 10px 8px}
.er-t{flex:1;min-width:0}
.er-x{font-size:15.5px;font-weight:700;color:var(--t1);line-height:1.3}
.er-z{font-size:12.5px;color:var(--t3);margin-top:2px}
.er-ok{background:var(--eni);color:#fff;border:none;border-radius:9px;
  padding:10px 15px;font:600 14.5px 'Montserrat',sans-serif;flex-shrink:0}
.er-spaet{border-left-color:var(--rot);background:#fff5f5}
.er-spaet .er-z{color:var(--rot);font-weight:600}
.er-spaet .er-ok{background:var(--rot)}

/* ---- Preise -------------------------------------------- */
.s-box{border-radius:9px;padding:11px 13px;font-size:15px;font-weight:600;
  margin-bottom:11px;line-height:1.35}
.s-ok{background:#f0fdf4;border:1.5px solid #22c55e;color:var(--gruen)}
.s-warn{background:#fff1f0;border:1.5px solid #ef4444;color:#b91c1c}
.s-inc{background:#fff8ed;border:1.5px solid #f59e0b;color:var(--gelb)}
.sp{border:1px solid #e5e5e5;border-radius:11px;padding:11px 13px;margin-bottom:9px}
.sp:last-of-type{margin-bottom:0}
.sp.mine{border:2px solid var(--eni);background:#f0f9ff}
.sp-n{font-size:15.5px;font-weight:700;color:var(--t1)}
.sp-b{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:20px;
  background:var(--eni);color:#fff;font-size:10.5px;font-weight:700;
  letter-spacing:.4px;vertical-align:2px}
.sp-a{font-size:12.5px;font-weight:500;color:var(--t3);margin-bottom:7px}
.sp-r{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0}
.sp-f{font-size:14px;color:var(--t2);font-weight:500}
.sp-p{font-size:20px;font-weight:800;color:var(--eni);font-variant-numeric:tabular-nums}
.sp-p.na{font-size:14px;font-weight:600;color:var(--rot)}
.sp-tag{display:block;text-align:right;font-size:11.5px;color:var(--t3);margin-top:-2px}

/* ---- Tägliche Aufgaben --------------------------------- */
.tk{display:flex;align-items:center;gap:11px;padding:11px 0;
  border-bottom:1px solid #f2f5f6}
.tk:last-child{border-bottom:none}
.tk-b{width:30px;height:30px;border:1.5px solid #c8d0d4;border-radius:8px;
  flex-shrink:0;background:#fff;color:#136b34;font-size:16px;font-weight:700;
  display:flex;align-items:center;justify-content:center}
.tk-b.quitt{border-color:#4a9c5f;background:#eaf6ec}
.tk-t{flex:1;font-size:15px;font-weight:600;line-height:1.35}
.tk-e .tk-t{font-weight:400;color:var(--t2)}
.tk-einm{display:inline-block;margin-left:7px;padding:1px 7px;border-radius:20px;
  background:#eef4f7;color:var(--t3);font-size:11px;font-weight:600}
.tk-z{font-size:12.5px;color:var(--t3);white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---- Zeilen, Eingaben ---------------------------------- */
.z{display:flex;align-items:flex-start;gap:10px;padding:10px 0;
  border-bottom:1px solid #f2f5f6}
.z:last-of-type{border-bottom:none}
.z-t{flex:1;font-size:15px;line-height:1.4}
.z-n{font-size:12.5px;color:var(--t3);margin-top:2px}
.z-x{background:none;border:none;color:var(--tl);font-size:20px;line-height:1;
  padding:2px 4px;flex-shrink:0}
/* Textfelder, die mitwachsen. Ein einzeiliges Feld schneidet längere
   Aufgabentexte ab – man bearbeitet dann etwas, das man nicht sieht. */
.feld{width:100%;padding:9px 10px;border:1px solid #c8d0d4;border-radius:8px;
  font:16px 'Montserrat',sans-serif;line-height:1.35;color:var(--t1);
  background:#fff;resize:none;overflow:hidden;display:block}
.feld:focus{outline:none;border-color:var(--eni2)}
.neu{display:flex;gap:8px;margin-top:8px}
.neu button{flex:1;padding:11px 8px;border-radius:10px;border:1px solid var(--eni);
  background:var(--eni);color:#fff;font:700 14.5px 'Montserrat',sans-serif}
.neu button.zweit{background:#fff;color:var(--eni)}
.eing{display:flex;gap:8px;margin-top:11px}
.eing input{flex:1;min-width:0;padding:11px 12px;border:1px solid #c8d0d4;
  border-radius:10px;font-size:16px;font-family:inherit;color:var(--t1);background:#fff}
.eing input:focus{outline:none;border-color:var(--eni2)}
.eing button{padding:11px 17px;background:var(--eni);color:#fff;border:none;
  border-radius:10px;font:700 16px 'Montserrat',sans-serif;flex-shrink:0}
.ok-hinweis{font-size:13px;color:var(--gruen);font-weight:600;margin-top:8px;min-height:17px}

/* ---- Wochenplan ---------------------------------------- */
.tl{display:flex;gap:4px;margin-bottom:12px}
.tl button{flex:1;background:#f4f8fa;border:1px solid #e4ebee;border-radius:10px;
  padding:7px 1px 6px;font-family:inherit;display:flex;flex-direction:column;
  align-items:center;gap:3px;min-width:0}
.tl button.an{background:var(--eni);border-color:var(--eni)}
.tl-d{font-size:11.5px;font-weight:700;color:var(--t2);line-height:1}
.tl-n{font-size:14px;font-weight:700;color:var(--t1);line-height:1}
.tl button.an .tl-d,.tl button.an .tl-n{color:#fff}
.tl-p{width:5px;height:5px;border-radius:50%;background:var(--eni2)}
.tl-p.aus{background:transparent}
.tl button.an .tl-p{background:#fff}
.buehne{touch-action:pan-y}
.tag{border:1px solid #e4ebee;border-radius:12px;overflow:hidden}
.tag.heute{border:2px solid var(--eni)}
.tag-k{padding:9px 12px;background:#f7fafb;font-size:13.5px;font-weight:700;
  color:var(--t2);display:flex;justify-content:space-between;
  border-bottom:1px solid #eef3f5}
.tag.heute .tag-k{background:#eaf6fc;color:var(--eni)}
.tag-k span{font-weight:600;color:var(--t3)}
.tag-i{padding:8px 12px 10px}
.zone{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  color:var(--t3);margin:6px 0 3px}
.zone.cal{color:#1d6d8f}
.we{display:flex;align-items:flex-start;gap:6px;padding:3px 0}
.we-t{flex:1;font-size:14.5px;line-height:1.4}
.we-x{background:none;border:none;color:var(--tl);font-size:18px;padding:0 3px;line-height:1.2}
.plus{background:none;border:none;color:var(--t3);font-size:13px;font-weight:600;
  font-family:inherit;padding:4px 0}
.wisch{font-size:12px;color:var(--t3);text-align:center;margin-top:10px}

/* ---- Dienstplan ---------------------------------------- */
.dp-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.dp-nav button{background:#eef4f7;border:1px solid #c6d6de;color:var(--eni);
  width:38px;height:38px;border-radius:10px;font-size:18px;font-family:inherit}
.dp-w{font-size:14.5px;font-weight:700;color:var(--t1)}
.dp-t{border-bottom:1px solid #f2f5f6;padding:9px 0;display:flex;gap:11px;
  align-items:flex-start}
.dp-t:last-child{border-bottom:none}
.dp-t.heute{background:#f0f9fd;margin:0 -15px;padding:9px 15px}
.dp-d{flex:0 0 58px;font-size:13.5px;font-weight:700;color:var(--t2);line-height:1.3}
.dp-d small{display:block;font-weight:500;color:var(--t3);font-size:12px}
.dp-s{flex:1;display:flex;flex-direction:column;gap:3px}
.dp-e{font-size:14.5px;display:flex;justify-content:space-between;gap:10px}
.dp-e b{font-weight:600;color:var(--t1)}
.dp-e span{color:var(--t2);font-variant-numeric:tabular-nums}
.dp-e.abw span{color:var(--gelb);font-weight:600}
.dp-frei{font-size:13.5px;color:var(--tl)}
.dp-heute{background:#f0f9fd;border:1px solid #cfe9f5;border-radius:11px;
  padding:11px 13px;margin-bottom:12px}
.dp-heute .kt{margin-bottom:7px}

/* ---- Protokoll ----------------------------------------- */
.pf{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.pf button{background:#f4f8fa;border:1px solid #e4ebee;border-radius:20px;
  padding:8px 14px;font:600 13px 'Montserrat',sans-serif;color:var(--t2)}
.pf button.an{background:var(--eni);border-color:var(--eni);color:#fff}
.pr-tag{font-size:11.5px;font-weight:700;color:var(--t3);text-transform:uppercase;
  letter-spacing:.8px;margin:14px 0 5px;padding-bottom:4px;border-bottom:1px solid #eef3f5}
.pr-z{display:flex;gap:9px;align-items:baseline;padding:6px 0;font-size:14px;
  border-bottom:1px solid #f7f9fa}
.pr-u{color:var(--t3);font-size:12.5px;font-variant-numeric:tabular-nums;flex:0 0 42px}
.pr-a{color:var(--eni);font-size:11.5px;font-weight:700;flex:0 0 74px}
.pr-w{flex:1;line-height:1.35}
.pr-p{color:var(--t3);font-size:12.5px;white-space:nowrap}

/* ---- Erinnerungen bearbeiten --------------------------- */
.eb{border:1px solid #e4ebee;border-radius:11px;padding:11px 12px;margin-bottom:9px}
.eb.aus{opacity:.55}
.eb-k{margin-bottom:8px}
.eb-r{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--t2)}
.eb-r label{display:flex;gap:5px;align-items:center}
.eb-r input[type=text]{width:66px;padding:7px 8px;border:1px solid #c8d0d4;
  border-radius:8px;font-size:16px;font-family:inherit;text-align:center}
.eb-tage{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.eb-tage button{border:1px solid #d5dee2;background:#fff;border-radius:7px;
  padding:5px 9px;font:600 12.5px 'Montserrat',sans-serif;color:var(--t3)}
.eb-tage button.an{background:var(--eni);border-color:var(--eni);color:#fff}
.eb-akt{display:flex;justify-content:space-between;align-items:center;margin-top:9px}
.eb-weg{background:none;border:none;color:var(--tl);font-size:12.5px;
  font-family:inherit;text-decoration:underline}

/* ---- Fußleiste ----------------------------------------- */
.fuss{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);
  backdrop-filter:blur(12px);border-top:1px solid #dbe4e8;display:flex;
  padding-bottom:env(safe-area-inset-bottom);z-index:50}
.fuss button{flex:1;background:none;border:none;padding:9px 2px 8px;
  font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px}
.fuss .ic{font-size:18px;line-height:1;opacity:.45}
.fuss .lb{font-size:11px;font-weight:600;color:var(--t3)}
.fuss button.an .ic{opacity:1}
.fuss button.an .lb{color:var(--eni)}
.fuss .pkt{position:absolute;margin:-6px 0 0 20px;width:7px;height:7px;
  border-radius:50%;background:var(--rot)}

/* ---- Start --------------------------------------------- */
.start{padding:70px 26px;text-align:center;color:#fff}
.start h2{font-size:20px;font-weight:700;margin-bottom:10px}
.start p{font-size:15px;color:rgba(255,255,255,.85);line-height:1.6;margin-bottom:22px}
.start button{background:#fff;color:var(--eni);border:none;border-radius:12px;
  padding:14px 28px;font:700 16px 'Montserrat',sans-serif}

</style>

<body>
<div id="app"><div class="start"><h2>Enilive Station Venier</h2>
  <p>Wird geladen …</p></div></div>
<script>
/* Enilive Station Venier – mobile Ansicht 2.0.0
   ------------------------------------------------------------
   Erzeugt aus denselben Modulen wie das Dashboard. Nicht von Hand
   ändern: Änderungen gehören in src/ und werden mit bundle.py
   wieder eingebaut, sonst laufen Rechner und Telefon auseinander.
   ------------------------------------------------------------ */
(function () {
'use strict';

/* ===== 10-store.js ===== */
/* ============================================================
   STORE – Einträge mit Zeitstempel, echtes Zusammenführen
   ------------------------------------------------------------
   Datenmodell (flach, damit Merge trivial bleibt):
     items: {
       "<key>": { t:<ms>, v:<wert> }      // aktiv
       "<key>": { t:<ms>, d:true }        // gelöscht (Grabstein)
     }
   Regel: Beim Zusammenführen gewinnt immer der höhere Zeitstempel.
   Grabsteine verhindern, dass gelöschte Einträge wieder auftauchen.
   ============================================================ */
const STORE = (() => {
  const LS_KEY   = 'eni_store_v2';
  const TOMB_TTL = 45 * 24 * 3600 * 1000;   // Grabsteine nach 45 Tagen entfernen
  /* Zeitstempel für Erstbestände: 1. Januar 2020, also älter als jede
     echte Änderung. Bewusst fest und nicht relativ zur Uhr, damit auf
     allen Geräten derselbe Wert steht. */
  const SEED_T = 1577836800000;

  let data    = { items: {} };
  let dirty   = false;
  const subs  = [];

  // ── intern ────────────────────────────────────────────────
  const now = () => Date.now();

  function readLS() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) {
        const p = JSON.parse(raw);
        if (p && p.items) return p;
      }
    } catch (_) {}
    return { items: {} };
  }

  /* Schreiben und Benachrichtigen werden gebündelt: Bei vielen Änderungen
     kurz hintereinander passiert beides nur einmal. Ohne das würde jede
     einzelne Änderung den kompletten Bestand schreiben und die Oberfläche
     neu aufbauen. */
  let flushTimer = null, needWrite = false, needNotify = false;

  /* Beim Schreiben immer erst den fremden Stand einmischen. Ohne das
     würde ein Tab die Änderungen eines anderen überschreiben, weil
     jedes Schreiben den gesamten Bestand ablegt. */
  function writeNow() {
    needWrite = false;
    try {
      const fresh = readLS();
      let got = 0;
      for (const k in fresh.items) {
        const r = fresh.items[k], l = data.items[k];
        if (!r || typeof r.t !== 'number') continue;
        if (!l || r.t > l.t) { data.items[k] = r; got++; }
      }
      localStorage.setItem(LS_KEY, JSON.stringify(data));
      if (got) needNotify = true;
    } catch (e) { console.warn('[Store] Speicher voll?', e); }
  }

  function flush() {
    flushTimer = null;
    const told = needWrite;
    if (needWrite)  writeNow();
    if (needNotify) { needNotify = false; subs.forEach(fn => { try { fn(); } catch (_) {} }); }
    // Andere Tabs erfahren sofort davon – ohne Umweg über das Netz
    if (told && typeof BUS !== 'undefined') BUS.send({ type: 'store' });
  }

  function writeLS() {
    needWrite = true;
    if (!flushTimer) flushTimer = setTimeout(flush, 0);
  }

  /* Ablegen ohne Einmischen. Nur für Fälle, in denen etwas absichtlich
     verschwinden soll – sonst würde das Einmischen es zurückholen. */
  function writeRaw() {
    needWrite = false;
    try { localStorage.setItem(LS_KEY, JSON.stringify(data)); }
    catch (e) { console.warn('[Store] Speicher voll?', e); }
  }

  function notify() {
    needNotify = true;
    if (!flushTimer) flushTimer = setTimeout(flush, 0);
  }

  /** Änderungen sofort festschreiben – vor dem Schließen der Seite. */
  function flushNow() { if (flushTimer) { clearTimeout(flushTimer); flush(); } else if (needWrite) writeNow(); }

  // ── öffentlich ────────────────────────────────────────────
  return {
    /** Lädt aus localStorage. Muss einmal beim Start laufen. */
    init() { data = readLS(); return this; },

    /** Rohdaten – nur für Sync und Backup. */
    raw()  { if (needWrite) writeNow(); return data; },

    /** Ausstehende Änderungen sofort sichern. */
    flushNow,

    /**
     * Aus dem lokalen Speicher nachlesen und einmischen.
     * Wird gebraucht, wenn ein anderer Tab etwas geändert hat.
     */
    reload() {
      if (needWrite) writeNow();          // Eigenes zuerst festschreiben
      const fresh = readLS();
      let changed = 0;
      for (const k in fresh.items) {
        const r = fresh.items[k], l = data.items[k];
        if (!r || typeof r.t !== 'number') continue;
        if (!l || r.t > l.t) { data.items[k] = r; changed++; }
      }
      if (changed) notify();
      return changed;
    },

    /** Wert setzen (überschreibt inkl. Grabstein). */
    put(key, value) {
      data.items[key] = { t: now(), v: value };
      dirty = true; writeLS(); notify();
      return value;
    },

    /**
     * Erstbestand ablegen: derselbe Vorgang wie put, aber mit einem
     * Zeitstempel weit in der Vergangenheit.
     *
     * Grund: Beim Zusammenführen gewinnt der neuere Zeitstempel. Ein mit
     * put angelegter Standardeintrag wäre tagesaktuell und schlüge damit
     * jeden Grabstein aus Drive – gelöschte Einträge kämen auf jedem
     * frisch eingerichteten Gerät zurück. Der Erstbestand ist aber der
     * älteste Stand und muss gegen alles verlieren, was danach kam.
     */
    seed(key, value) {
      data.items[key] = { t: SEED_T, v: value };
      dirty = true; writeLS(); notify();
      return value;
    },

    /** Eintrag löschen – hinterlässt Grabstein. */
    del(key) {
      if (!data.items[key]) return;
      data.items[key] = { t: now(), d: true };
      dirty = true; writeLS(); notify();
    },

    /** Wert lesen; null wenn nicht vorhanden oder gelöscht. */
    get(key, def = null) {
      const e = data.items[key];
      return (e && !e.d) ? e.v : def;
    },

    /** Existiert der Schlüssel (und ist nicht gelöscht)? */
    has(key) { const e = data.items[key]; return !!(e && !e.d); },

    /**
     * Alle Einträge eines Typs als Array [{key, ...wert}].
     * Konvention: Schlüssel lautet "<typ>:<id>".
     */
    list(type) {
      const pre = type + ':';
      const out = [];
      for (const k in data.items) {
        if (k.indexOf(pre) !== 0) continue;
        const e = data.items[k];
        if (!e || e.d) continue;
        /* Schlüssel ZULETZT setzen. Viele Aufrufer schreiben beim Ändern
           `_key: undefined` mit ins Objekt, um das Feld loszuwerden – stünde
           der Schlüssel zuerst, überschriebe dieses undefined ihn wieder.
           Der Eintrag hätte dann keinen Schlüssel mehr, und alles, was damit
           nachschlägt, liefe ins Leere. */
        out.push(Object.assign({}, e.v, { _key: k, _id: k.slice(pre.length) }));
      }
      return out;
    },

    /** Neuen Eintrag mit erzeugter ID anlegen. Gibt den Schlüssel zurück. */
    add(type, value) {
      const id  = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      const key = type + ':' + id;
      this.put(key, value);
      return key;
    },

    /**
     * Fremdstand einmischen. Gibt zurück, wie viele Einträge übernommen wurden.
     * Der lokale Stand bleibt erhalten, wo er neuer ist.
     */
    merge(remote) {
      if (!remote || !remote.items) return 0;
      let changed = 0;
      for (const k in remote.items) {
        const r = remote.items[k];
        if (!r || typeof r.t !== 'number') continue;
        const l = data.items[k];
        if (!l || r.t > l.t) { data.items[k] = r; changed++; }
      }
      if (changed) { writeLS(); notify(); }
      return changed;
    },

    /**
     * Alte Grabsteine entfernen, damit der Bestand nicht unbegrenzt wächst.
     * Erst alles zusammenführen, dann aufräumen, dann ohne Einmischen ablegen –
     * sonst kämen die entfernten Einträge beim nächsten Schreiben zurück.
     */
    sweep() {
      if (needWrite) writeNow();
      const cut = now() - TOMB_TTL;
      let n = 0;
      for (const k in data.items) {
        const e = data.items[k];
        if (e && e.d && e.t < cut) { delete data.items[k]; n++; }
      }
      if (n) writeRaw();
      return n;
    },

    /** Kompletten Stand ersetzen – für Backup-Import. */
    replaceAll(next) {
      if (!next || !next.items) return false;
      data = { items: next.items };
      writeLS(); notify();
      return true;
    },

    /** Bei jeder Änderung benachrichtigen (UI-Neuaufbau). */
    subscribe(fn) { subs.push(fn); },

    /** Wurde seit dem letzten Hochladen etwas geändert? */
    isDirty()  { return dirty; },
    clearDirty() { dirty = false; }
  };
})();

/* ===== 20-prices.js ===== */
/* ============================================================
   PREISE – eine gemeinsame Quelle für Monitor und Dashboard
   ============================================================ */
const PRICE = (() => {
  const FUELS     = ['SUP', 'DIE'];
  const FL        = { SUP: 'Super 95', DIE: 'Diesel' };
  const CRIT_JET  = 0.010;    // bis 1 Cent über JET: alles in Ordnung
  /* Zwischen 1 und 1,5 Cent über JET wird gewarnt statt Alarm geschlagen.
     Die Abstände liegen in letzter Zeit oft knapp über einem Cent – ein
     roter Alarm bei jeder Kleinigkeit stumpft ab, und dann wird auch der
     echte Handlungsbedarf übersehen. Gilt nur nach oben: Sind wir günstiger,
     gibt es ohnehin nichts zu tun. */
  const TOL_JET   = 0.015;
  const CRIT_OMV  = 0.000;    // OMV dürfen wir nicht überschreiten
  const EPS       = 0.0001;
  const STALE_MS  = 20 * 60 * 1000;

  /** "2029" → 2.029 | "1,839" → 1.839 | Unsinn → null */
  function parse(val) {
    if (val === null || val === undefined || val === '') return null;
    const s = String(val).replace(',', '.').trim();
    const n = parseFloat(s);
    if (isNaN(n)) return null;
    if (Number.isInteger(n) && n >= 1000 && n <= 9999) return +(n / 1000).toFixed(3);
    if (n >= 0.5 && n <= 5.0) return +n.toFixed(3);
    return null;
  }

  const fmt = v => (v !== null && v !== undefined) ? Number(v).toFixed(3) + ' €' : '–';

  /**
   * Gültiger OMV-Wert. Drei Stufen, in dieser Reihenfolge:
   *   gemessen   – aus der Antwort gelesen
   *   berechnet  – aus der Position hergeleitet, eni ist gelistet
   *   geschätzt  – teuerster gelisteter Preis plus 1 Cent, weil weder
   *                eni noch OMV gelistet sind
   */
  const omv = (P, f) => {
    if (P['omv_' + f] !== null && P['omv_' + f] !== undefined) return P['omv_' + f];
    if (P['omv_' + f + '_est']  !== null && P['omv_' + f + '_est']  !== undefined)
      return P['omv_' + f + '_est'];
    if (P['omv_' + f + '_gsch'] !== null && P['omv_' + f + '_gsch'] !== undefined)
      return P['omv_' + f + '_gsch'];
    return null;
  };

  const omvIsEstimate = (P, f) =>
    (P['omv_' + f] === null || P['omv_' + f] === undefined) &&
    (P['omv_' + f + '_est'] !== null && P['omv_' + f + '_est'] !== undefined);

  /** Grob geschätzt, weil auch die eigene Station nicht gelistet ist. */
  const omvIsGuess = (P, f) =>
    (P['omv_' + f] === null || P['omv_' + f] === undefined) &&
    (P['omv_' + f + '_est'] === null || P['omv_' + f + '_est'] === undefined) &&
    (P['omv_' + f + '_gsch'] !== null && P['omv_' + f + '_gsch'] !== undefined);

  /** Ist die eigene Station bei dieser Sorte aus dem Ranking gefallen? */
  const eniOut = (P, f) => P['eni_' + f + '_out'] === true;
  const anyEniOut = (P) => FUELS.some(f => eniOut(P, f));

  /** OMV aus der Position in der Trefferliste herleiten. */
  function estimateOmv(P, fuel) {
    const eniP   = P['eni_' + fuel];
    const omvPos = P['omv_pos_' + fuel];
    const eniPos = P['eni_pos_' + fuel];
    const pm     = P['pos_price_map_' + fuel] || {};
    if (eniP === null || eniP === undefined) return null;
    if (omvPos === null || omvPos === undefined) return null;
    if (eniPos === null || eniPos === undefined) return null;

    if (omvPos < eniPos) {
      return { price: +(eniP - 0.010).toFixed(3),
               method: 'Pos.' + omvPos + ' vor eni → eni−0,010' };
    }
    let maxP = eniP, maxL = 'eni(Pos.' + eniPos + ')';
    for (let p = eniPos + 1; p < omvPos; p++) {
      if (pm[p] !== null && pm[p] !== undefined && pm[p] > maxP) { maxP = pm[p]; maxL = 'Pos.' + p; }
    }
    return { price: +maxP.toFixed(3), method: 'Pos.' + omvPos + ' hinter eni → ' + maxL };
  }

  /** Eine Sorte prüfen. null, wenn ein Wert fehlt. */
  function checkFuel(P, fuel) {
    const e = P['eni_' + fuel], j = P['jet_' + fuel], o = omv(P, fuel);
    if (e === null || e === undefined) return null;
    if (j === null || j === undefined) return null;
    if (o === null || o === undefined) return null;
    const jetOk  = e <= j + CRIT_JET + EPS;
    const jetTol = !jetOk && e <= j + TOL_JET + EPS;
    const omvOk  = e <= o + CRIT_OMV + EPS;
    return {
      jetOk: jetOk,
      /* im Toleranzband: über einem Cent, aber höchstens 1,5 Cent über JET */
      jetTol: jetTol,
      omvOk: omvOk,
      need:  (!jetOk && !jetTol) || !omvOk,
      warn:  jetTol && omvOk
    };
  }

  const isPauseTime = (d) => {
    const n = d || new Date();
    const t = n.getHours() * 60 + n.getMinutes();
    return t >= 720 && t < 735;                    // 12:00–12:15
  };

  /* Wann lohnt sich ein Abruf?
     Senkungen sind rund um die Uhr möglich, erhöht werden darf nur um 12:00.
     Ausgesetzt wird deshalb nur dort, wo keine brauchbaren Daten kommen:
       12:00–12:15  Umstellung, der Spritpreisrechner ist abgeschaltet
       22:00–06:00  Nachtruhe
     Sonst durchgehend – damit geht keine Senkung verloren. */
  /**
   * Wann wird abgefragt?
   *   05:00–21:00   ja – die Station ist offen, eine Stunde Vorlauf vor
   *                 Öffnung, damit um 06:00 aktuelle Preise dastehen
   *   12:00–12:15   nein – Umstellung, der Spritpreisrechner ist abgeschaltet
   *   21:00–05:00   nein – Station geschlossen, Preise ohne Belang
   */
  const isFetchTime = (d) => {
    const n = d || new Date();
    const t = n.getHours() * 60 + n.getMinutes();
    if (t >= 720 && t < 735) return false;      // Mittagsumstellung
    return t >= 300 && t < 1260;                // 05:00–21:00
  };

  /* Bestandsname, gleiche Bedeutung – wird vom Panel genutzt. */
  const isOperatingTime = isFetchTime;

  const isStale = (P, nowMs) =>
    !P['_ms'] || ((nowMs || Date.now()) - P['_ms']) > STALE_MS;

  /**
   * Gesamtstatus – bewusst auf drei Zustände beschränkt.
   *
   *   ok      alles vollständig geprüft und im Rahmen
   *   warn    im Toleranzband – über einem Cent, aber höchstens 1,5 Cent
   *           über JET. Kein Grund zur Eile, aber im Auge behalten.
   *   alarm   irgendwo besteht Handlungsbedarf
   *   stale   die Anzeige ist nicht verlässlich (alt, unvollständig, kein Abruf)
   *
   * Keine Nennung einzelner Sorten oder Mitbewerber: Eine Teilangabe verleitet
   * zur Teilmeldung, und eine unvollständige Preismeldung wird vom Zentralrechner
   * verworfen. Gemeldet werden müssen immer alle Mitbewerber und alle Sorten.
   * Die technischen Einzelheiten stehen im Selbsttest, nicht im Betrieb.
   */
  function status(P, opts) {
    opts = opts || {};

    const hasAny = FUELS.some(f =>
      (P['eni_' + f] !== null && P['eni_' + f] !== undefined) ||
      (P['jet_' + f] !== null && P['jet_' + f] !== undefined) ||
      omv(P, f) !== null);

    // Fehlt alles, ist die Anzeige nicht verlässlich – mehr muss niemand wissen.
    if (!hasAny) return { level: 'stale', text: 'Preise nicht aktuell', missing: [] };

    const missing = [];
    let need = false, warn = false;

    FUELS.forEach(f => {
      const c = checkFuel(P, f);
      if (!c) {
        if (P['eni_' + f] === null || P['eni_' + f] === undefined) missing.push('eni ' + FL[f]);
        if (P['jet_' + f] === null || P['jet_' + f] === undefined) missing.push('JET ' + FL[f]);
        if (omv(P, f) === null)                                    missing.push('OMV ' + FL[f]);
      } else if (c.need) {
        need = true;
      } else if (c.warn) {
        warn = true;
      }
    });

    /* Die eigene Station ist aus dem Ranking gefallen: teurer als alle
       gelisteten. Das wiegt schwerer als jeder Vergleich – und ist der
       Fall, in dem früher fälschlich „Alles in Ordnung" stand. */
    if (anyEniOut(P)) {
      return { level: 'alarm', missing: missing,
               text: 'Handlungsbedarf – Preise hier laufend beobachten und im Kassensystem eingeben!' };
    }

    // Handlungsbedarf geht immer vor – auch nachts und bei lückenhaften Daten.
    if (need) {
      return { level: 'alarm', text: 'Handlungsbedarf – Preise im Kassensystem eingeben!', missing };
    }

    // Während der Umstellung sind die Daten unbrauchbar; das ist kein Mangel,
    // aber verlässlich ist die Anzeige trotzdem nicht.
    if (isPauseTime(opts.date)) {
      return { level: 'stale', text: 'Preise nicht aktuell', missing: [] };
    }

    /* Toleranzband. Erst nach den Alarm- und Verlässlichkeitsprüfungen:
       Eine Warnung darf nie einen Handlungsbedarf verdecken. */
    if (warn && !missing.length && !isStale(P, opts.now)) {
      return { level: 'warn', missing: [],
               text: 'Preise akzeptabel – bitte weiterhin beobachten und eingeben' };
    }

    // Lücken oder veraltete Werte laufen auf dieselbe Aussage hinaus:
    // nicht darauf verlassen.
    if (missing.length || isStale(P, opts.nowMs)) {
      return { level: 'stale', text: 'Preise nicht aktuell', missing: missing };
    }

    return { level: 'ok', text: 'Alles in Ordnung', missing: [] };
  }

  return { FUELS, FL, CRIT_JET, CRIT_OMV, parse, fmt, omv, omvIsEstimate, omvIsGuess,
           eniOut, anyEniOut,
           estimateOmv, checkFuel, status, isPauseTime, isOperatingTime, isFetchTime, isStale };
})();

/* ===== 26-auswertung.js ===== */
/* ============================================================
   AUSWERTUNG – aus einer Trefferliste werden Preise
   ------------------------------------------------------------
   Bisher stand das im Monitor, zwischen Panel und Statuszeile.
   Die mobile Seite braucht dieselbe Auswertung, hat aber weder
   Panel noch Statuszeile – und eine zweite Fassung derselben
   Regeln wäre die Sorte Fehler, die erst auffällt, wenn am
   Telefon ein anderer Preis steht als am Rechner.

   Deshalb hier: nur Daten hinein, nur Daten heraus, keine
   Oberfläche. Wer die Werte anzeigt, entscheidet der Aufrufer.
   ============================================================ */
const AUSW = (() => {

  /* Namenserkennung. Die eigene Station ist die in der Bundesstraße
     in Imst – nicht die an der Autobahn, nicht die in Haiming. */
  const istJet = n => /^jet(\s|$)/i.test(String(n).trim()) || /jet\s*tankstelle/i.test(n);
  const istOmv = n => /^omv(\s|$)/i.test(String(n).trim());
  const istEni = (n, addr) => {
    if (!/^eni(\s|$)/i.test(String(n).trim())) return false;
    if (/autobahn|a\s*12|a12/i.test(n)) return false;
    if (addr) {
      if (/bundesstr/i.test(addr) && /imst/i.test(addr)) return true;
      if (/langgasse/i.test(addr)) return false;
      if (/haiming|mils|tarrenz/i.test(addr)) return false;
    }
    return true;
  };

  /** Welche Sorte wurde abgefragt? Aus der Adresse gelesen. */
  const sorte = url => { const m = url && url.match(/fuelType=([A-Z]+)/); return m ? m[1] : null; };

  /* ---- Änderungsprotokoll ---- */
  /* Bewusst ohne Browsermeldung: Preise ändern sich oft, und die Fenster
     am Bildschirmrand haben im Betrieb nur gestört. Wer die Änderungen
     sehen will, öffnet das Änderungs-Log. */
  function protokollieren(label, fuel, oldP, newP) {
    if (oldP == null || Math.abs(oldP - newP) < 0.0001) return;
    const diff = (newP - oldP).toFixed(3);
    const sign = newP > oldP ? '+' : '', arrow = newP > oldP ? '↑' : '↓';
    const log = STORE.get('pricelog', []) || [];
    log.unshift({ ts: new Date().toLocaleString('de-AT'), label: label, fuel: PRICE.FL[fuel],
                  old: oldP.toFixed(3), new: newP.toFixed(3), diff: sign + diff, arrow: arrow });
    STORE.put('pricelog', log.slice(0, 60));
  }

  /**
   * Trefferliste auswerten. Der übergebene Preisstand wird verändert
   * und zurückgegeben; abgelegt wird er vom Aufrufer.
   */
  function auswerten(P, stations, fuel) {
    const price = s => { const p = (s.prices||[]).find(x => x.fuelType === fuel); return p ? p.amount : null; };
    const withP = stations.filter(s => price(s) != null).sort((a,b) => price(a) - price(b));
    const sorted = withP.concat(stations.filter(s => price(s) == null));

    let jetPos = null, omvPos = null, eniPos = null;
    sorted.forEach((s, i) => {
      const n = s.name || '';
      const a = ((s.location && s.location.address) || '') + ' ' + ((s.location && s.location.city) || '');
      if (jetPos == null && istJet(n)) jetPos = i + 1;
      if (omvPos == null && istOmv(n)) omvPos = i + 1;
      if (eniPos == null && istEni(n, a.trim())) eniPos = i + 1;
    });

    if (omvPos != null) P['omv_pos_' + fuel] = omvPos;
    if (eniPos != null) P['eni_pos_' + fuel] = eniPos;
    if (jetPos != null) P['jet_pos_' + fuel] = jetPos;

    const pm = {};
    sorted.forEach((s, i) => { const p = price(s); if (p != null) pm[i+1] = p; });
    P['pos_price_map_' + fuel] = pm;

    const imst = stations.filter(s => {
      const c = ((s.location && s.location.city) || '').toLowerCase();
      const z = (s.location && s.location.postalCode) || '';
      return c.indexOf('imst') >= 0 || z === '6460';
    });
    const pick = fn => { const st = imst.find(fn); return st ? price(st) : null; };
    const now = new Date().toLocaleTimeString('de-AT');

    const jetP = pick(s => istJet(s.name || ''));
    if (jetP != null) { protokollieren('JET', fuel, P['jet_'+fuel], jetP);
                        P['jet_'+fuel] = jetP; P['jet_'+fuel+'_ts'] = now; }

    const omvP = pick(s => istOmv(s.name || ''));
    if (omvP != null) {
      protokollieren('OMV', fuel, P['omv_'+fuel], omvP);
      P['omv_'+fuel] = omvP; P['omv_'+fuel+'_ts'] = now;
      delete P['omv_'+fuel+'_est']; delete P['omv_'+fuel+'_est_method'];
    } else {
      delete P['omv_'+fuel];
      const e = PRICE.estimateOmv(P, fuel);
      if (e) { P['omv_'+fuel+'_est'] = e.price; P['omv_'+fuel+'_est_method'] = e.method; }
    }

    const eniP = pick(s => istEni(s.name || '',
      (((s.location && s.location.address) || '') + ' ' + ((s.location && s.location.city) || '')).trim()));
    if (eniP != null) {
      protokollieren('eni', fuel, P['eni_'+fuel], eniP);
      P['eni_'+fuel] = eniP; P['eni_'+fuel+'_src'] = 'page'; P['eni_'+fuel+'_ts'] = now;
      delete P['eni_'+fuel+'_out'];
      if (P['omv_'+fuel] == null) {
        const e = PRICE.estimateOmv(P, fuel);
        if (e) { P['omv_'+fuel+'_est'] = e.price; P['omv_'+fuel+'_est_method'] = e.method; }
      }
    } else {
      /* Die Schnittstelle liefert nur die günstigsten Stationen. Fehlt die
         eigene darin, ist sie teurer als alle gelisteten – das ist kein
         Datenmangel, sondern der schlechteste denkbare Zustand.
         Der alte Wert wird verworfen: er wäre falsch und würde eine
         Entwarnung vortäuschen. */
      delete P['eni_'+fuel];
      delete P['eni_'+fuel+'_src'];
      delete P['eni_'+fuel+'_ts'];
      P['eni_'+fuel+'_out'] = true;
    }

    /* Ist auch OMV nicht gelistet, lässt sich nichts mehr aus Positionen
       herleiten. Dann gilt: teuerster gelisteter Preis plus ein Cent. */
    if (P['eni_'+fuel+'_out'] && omvP == null) {
      let hoechster = null;
      Object.keys(pm).forEach(k => {
        const v = pm[k];
        if (v != null && (hoechster == null || v > hoechster)) hoechster = v;
      });
      delete P['omv_'+fuel+'_est'];
      delete P['omv_'+fuel+'_est_method'];
      if (hoechster != null) {
        P['omv_'+fuel+'_gsch'] = +(hoechster + 0.010).toFixed(3);
      } else {
        delete P['omv_'+fuel+'_gsch'];
      }
    } else {
      delete P['omv_'+fuel+'_gsch'];
    }

    P._ts = now; P._ms = Date.now();
    return P;
  }

  return { istJet, istOmv, istEni, sorte, protokollieren, auswerten };
})();

/* ===== 45-dienstplan.js ===== */
/* ============================================================
   DIENSTPLAN
   ------------------------------------------------------------
   Speicher:  "dp:<jahr>-<monat>"  →  { emps:[Name], eintraege:{ "<name>|<tag>": "<wert>" } }
   Werte:     "6-13" (Minuten seit Mitternacht als Paar), "u", "k" oder ""
   ============================================================ */
const DP = (() => {
  const NAMEN_TAG = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
  const STD_EMPS  = ['Mathias','Bettina','Sylvia','Haval'];

  const key = (j, m) => 'dp:' + j + '-' + String(m).padStart(2, '0');

  /* ---- Zeiterkennung ------------------------------------
     Aus dem, was getippt wird, eine eindeutige Angabe machen.
     Erlaubt: "6 13" · "6,30 13" · "630 1330" · "6.30-13" · "u" · "k"
     Rückgabe: { von, bis } in Minuten, oder { code:'u'|'k' }, oder null. */
  function parse(text) {
    const t = String(text == null ? '' : text).trim().toLowerCase();
    if (!t) return { leer: true };
    if (t === 'u' || t === 'url' || t === 'urlaub')      return { code: 'u' };
    if (t === 'k' || t === 'kr'  || t === 'krank' ||
        t === 'krankenstand')                             return { code: 'k' };

    // Trenner vereinheitlichen: Komma und Doppelpunkt werden zum Punkt
    const norm = t.replace(/,/g, '.').replace(/:/g, '.');
    // Zwei Zeitangaben herausziehen
    const teile = norm.split(/[\s\-–—bis]+/).filter(Boolean);
    if (teile.length !== 2) return null;

    const zeit = (z) => {
      // "6" → 360 · "6.30" → 390 · "630" → 390 · "1330" → 810
      let h, m;
      if (z.indexOf('.') >= 0) {
        const p = z.split('.');
        h = parseInt(p[0], 10);
        m = parseInt((p[1] + '0').slice(0, 2), 10);
      } else if (z.length <= 2) {
        h = parseInt(z, 10); m = 0;
      } else if (z.length === 3) {
        h = parseInt(z.slice(0, 1), 10); m = parseInt(z.slice(1), 10);
      } else if (z.length === 4) {
        h = parseInt(z.slice(0, 2), 10); m = parseInt(z.slice(2), 10);
      } else return null;
      if (isNaN(h) || isNaN(m) || h < 0 || h > 24 || m < 0 || m > 59) return null;
      return h * 60 + m;
    };

    const von = zeit(teile[0]), bis = zeit(teile[1]);
    if (von === null || bis === null) return null;
    if (bis <= von) return null;                 // Nachtschichten kommen nicht vor
    return { von: von, bis: bis };
  }

  /** Gespeicherte Form: "360-780" bzw. "u"/"k". */
  function toStore(p) {
    if (!p || p.leer) return '';
    if (p.code) return p.code;
    return p.von + '-' + p.bis;
  }

  function fromStore(v) {
    const s = String(v || '');
    if (!s) return { leer: true };
    if (s === 'u' || s === 'k') return { code: s };
    const m = /^(\d+)-(\d+)$/.exec(s);
    return m ? { von: +m[1], bis: +m[2] } : null;
  }

  /** Kompakte Anzeige: 6–13 · 6.30–13 · U · K */
  function fmt(v) {
    const p = (typeof v === 'string') ? fromStore(v) : v;
    if (!p || p.leer) return '';
    if (p.code) return p.code === 'u' ? 'U' : 'K';
    const teil = (min) => {
      const h = Math.floor(min / 60), m = min % 60;
      return m ? h + '.' + String(m).padStart(2, '0') : String(h);
    };
    return teil(p.von) + '–' + teil(p.bis);
  }

  /** Ausgeschrieben: 6.00 – 11.00 · 6.30 – 14.00 · U · K
      Am Bildschirm gut lesbar; für den Ausdruck bleibt fmt(), dort zählt
      jeder Millimeter. */
  function fmtLang(v) {
    const p = (typeof v === 'string') ? fromStore(v) : v;
    if (!p || p.leer) return '';
    if (p.code) return p.code === 'u' ? 'U' : 'K';
    const teil = (min) => Math.floor(min / 60) + '.' + String(min % 60).padStart(2, '0');
    return teil(p.von) + ' – ' + teil(p.bis);
  }

  /** Stunden eines Eintrags. Urlaub und Krankenstand zählen nicht mit. */
  function stunden(v) {
    const p = (typeof v === 'string') ? fromStore(v) : v;
    if (!p || p.leer || p.code) return 0;
    return (p.bis - p.von) / 60;
  }

  /* ---- Monat lesen und schreiben ------------------------ */
  function monat(j, m) {
    const d = STORE.get(key(j, m));
    if (d) return { emps: (d.emps || []).slice(), eintraege: Object.assign({}, d.eintraege || {}) };
    // Noch nicht angelegt: Mitarbeiter aus dem Vormonat übernehmen
    const vm = m === 1 ? { j: j - 1, m: 12 } : { j: j, m: m - 1 };
    const v = STORE.get(key(vm.j, vm.m));
    return { emps: (v && v.emps && v.emps.length) ? v.emps.slice() : STD_EMPS.slice(),
             eintraege: {} };
  }

  const exists = (j, m) => STORE.has(key(j, m));

  function speichern(j, m, daten) {
    STORE.put(key(j, m), { emps: daten.emps, eintraege: daten.eintraege });
  }

  function setzen(j, m, name, tag, text) {
    const d = monat(j, m);
    const p = parse(text);
    if (p === null) return { ok: false };            // nicht erkannt
    const v = toStore(p);
    const k = name + '|' + tag;
    if (v) d.eintraege[k] = v; else delete d.eintraege[k];
    speichern(j, m, d);
    return { ok: true, wert: v, anzeige: fmtLang(v) };
  }

  function empHinzu(j, m, name) {
    name = String(name || '').trim();
    if (!name) return false;
    const d = monat(j, m);
    if (d.emps.indexOf(name) >= 0) return false;
    d.emps.push(name);
    speichern(j, m, d);
    return true;
  }

  function empEntfernen(j, m, name) {
    const d = monat(j, m);
    d.emps = d.emps.filter(x => x !== name);
    Object.keys(d.eintraege).forEach(k => {
      if (k.slice(0, k.lastIndexOf('|')) === name) delete d.eintraege[k];
    });
    speichern(j, m, d);
  }

  /** Wie viele Einträge hat ein Mitarbeiter in diesem Monat? */
  function empAnzahl(j, m, name) {
    const d = monat(j, m);
    return Object.keys(d.eintraege).filter(k =>
      k.slice(0, k.lastIndexOf('|')) === name && d.eintraege[k]).length;
  }

  /* ---- Wochenblöcke, Montag bis Sonntag ----------------- */
  /**
   * Wochenblöcke, Montag bis Sonntag – immer sieben Einträge je Block.
   * Angebrochene Wochen werden mit Platzhaltern aufgefüllt, damit jeder
   * Wochentag in jeder Woche dieselbe Spalte behält.
   * Platzhalter: { tag: null, wd: <0..6> }
   */
  function bloecke(j, m) {
    const letzter = new Date(j, m, 0).getDate();
    const out = []; let w = [];
    for (let t = 1; t <= letzter; t++) {
      const wd = (new Date(j, m - 1, t).getDay() + 6) % 7;
      if (wd === 0 && w.length) { out.push(w); w = []; }
      if (!w.length && wd > 0) {
        // Erste Woche beginnt mitten in der Woche: davor auffüllen
        for (let x = 0; x < wd; x++) w.push({ tag: null, wd: x });
      }
      w.push({ tag: t, wd: wd });
    }
    if (w.length) {
      // Letzte Woche bis Sonntag auffüllen
      for (let x = w.length; x < 7; x++) w.push({ tag: null, wd: x });
      out.push(w);
    }
    return out;
  }

  /* ---- Summen ------------------------------------------- */
  function summen(j, m) {
    const d = monat(j, m);
    const out = d.emps.map(n => {
      let h = 0, dienste = 0, url = 0, krank = 0;
      Object.keys(d.eintraege).forEach(k => {
        if (k.slice(0, k.lastIndexOf('|')) !== n) return;
        const v = d.eintraege[k];
        if (v === 'u') { url++; return; }
        if (v === 'k') { krank++; return; }
        const st = stunden(v);
        if (st > 0) { h += st; dienste++; }
      });
      return { name: n, stunden: h, dienste: dienste, urlaub: url, krank: krank };
    });
    out.gesamt = out.reduce((a, x) => a + x.stunden, 0);
    return out;
  }

  const monatsName = (m) => ['Januar','Februar','März','April','Mai','Juni','Juli',
    'August','September','Oktober','November','Dezember'][m - 1];

  return { NAMEN_TAG, parse, toStore, fromStore, fmt, fmtLang, stunden, monat, exists,
           speichern, setzen, empHinzu, empEntfernen, empAnzahl,
           bloecke, summen, monatsName, key };
})();

/* ===== 46-protokoll.js ===== */
/* ============================================================
   PROTOKOLL – ein Buch für alles
   ------------------------------------------------------------
   Bisher führte nur die Aufgabenverwaltung ein eigenes Protokoll
   („tlog"). Mit den Erinnerungen kämen weitere dazu, und jede
   neue Quelle bräuchte wieder eine eigene Ansicht.

   Deshalb ein gemeinsames Buch mit einheitlichen Feldern. Neue
   Quellen hängen sich an, ohne dass etwas umgebaut werden muss.

   Aufbau eines Eintrags:
     "log:<id>" → { art, was, ts, wer, bezug }
       art   – Quelle: 'aufgabe', 'erinnerung', später mehr
       was   – Klartext, so wie er in der Ansicht stehen soll
       ts    – Zeitpunkt in Millisekunden
       wer   – Name aus dem Dienstplan, kann leer sein
       bezug – Schlüssel des Eintrags, um den es ging
   ============================================================ */
const PROT = (() => {
  /* Wie die Arten in der Ansicht heißen. Unbekannte Arten werden
     unverändert durchgereicht – so bricht nichts, wenn eine neue
     Quelle dazukommt, bevor sie hier eingetragen ist. */
  const ARTEN = {
    aufgabe:    'Aufgabe',
    erinnerung: 'Erinnerung'
  };

  const artName = a => ARTEN[a] || String(a || '–');

  /**
   * Eintrag schreiben. Gibt den Schlüssel zurück.
   * `wer` und `bezug` sind freiwillig.
   */
  function schreiben(art, was, wer, bezug) {
    return STORE.add('log', {
      art: String(art || ''),
      was: String(was || ''),
      ts: Date.now(),
      wer: String(wer || ''),
      bezug: bezug || ''
    });
  }

  /** Einträge, neueste zuerst. Wahlweise auf eine Art eingegrenzt. */
  function alle(grenze, art) {
    let l = STORE.list('log');
    if (art) l = l.filter(x => x.art === art);
    return l.sort((a, b) => (b.ts || 0) - (a.ts || 0)).slice(0, grenze || 300);
  }

  /** Welche Arten tatsächlich vorkommen – für die Filterleiste. */
  function arten() {
    const s = {};
    STORE.list('log').forEach(x => { if (x.art) s[x.art] = 1; });
    return Object.keys(s).sort();
  }

  /**
   * Alte Aufgaben-Einträge übernehmen. Ohne diesen Schritt bräche die
   * Geschichte an dem Tag ab, an dem umgestellt wurde. Läuft nur einmal;
   * die Herkunftseinträge bleiben unangetastet, damit nichts verloren
   * geht, falls die Übernahme wiederholt werden muss.
   */
  function uebernehmen() {
    if (STORE.has('log_migriert')) return 0;
    let n = 0;
    STORE.list('tlog').forEach(x => {
      STORE.put('log:alt_' + String(x._key).replace('tlog:', ''), {
        art: 'aufgabe',
        was: x.text || '',
        ts: x.ts || 0,
        wer: x.wer || '',
        bezug: x.task || ''
      });
      n++;
    });
    STORE.put('log_migriert', new Date().toISOString());
    return n;
  }

  /** Einträge älter als 90 Tage entfernen, damit das Buch nicht wuchert. */
  function aufraeumen() {
    const cut = Date.now() - 90 * 864e5;
    let n = 0;
    STORE.list('log').forEach(x => {
      if ((x.ts || 0) < cut) { STORE.del(x._key); n++; }
    });
    return n;
  }

  /** Nach Tagen gruppiert, für die Ansicht. */
  function nachTagen(grenze, art) {
    const tage = [];
    const index = {};
    alle(grenze, art).forEach(x => {
      const d = new Date(x.ts || 0);
      const tag = d.toLocaleDateString('de-AT',
        { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' });
      if (!index[tag]) { index[tag] = { tag: tag, items: [] }; tage.push(index[tag]); }
      index[tag].items.push(x);
    });
    return tage;
  }

  return { schreiben, alle, arten, artName, nachTagen, uebernehmen, aufraeumen };
})();

/* ===== 48-verwaltung.js ===== */
/* ============================================================
   TÄGLICHE AUFGABEN
   ------------------------------------------------------------
   Abhaken setzt einen Zeitstempel und schreibt ins Protokoll.
   Der Haken verschwindet danach, der Zeitpunkt bleibt dezent
   stehen und wird beim nächsten Mal überschrieben.

   Speicher:  "task:<id>"  → { text, pos, einmalig, ts, wer }
              "tlog:<id>"  → { task, text, ts, wer }
   ============================================================ */
const TASKS = (() => {
  const START = [
    'Toiletten kontrolliert und gereinigt',
    'Shop gereinigt',
    'Außenbereich erledigt (Müll, Kübel, Rollboxen, Papier …)'
  ];

  const kennung = (t, i) => 'task:' + String(t).toLowerCase()
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
    .replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,24) + '_' + i;

  function ersteinrichtung() {
    let n = 0;
    START.forEach((t, i) => {
      const k = kennung(t, i);
      if (STORE.raw().items[k]) return;
      STORE.seed(k, { text: t, pos: (i + 1) * 10, einmalig: false });
      n++;
    });
    return n;
  }

  const alle = () => STORE.list('task').sort((a,b) => (a.pos||0) - (b.pos||0));

  /** Wer hat gerade Dienst? Aus dem Dienstplan, ohne Nachfrage. */
  function diensthabend() {
    const n = new Date();
    const d = DP.monat(n.getFullYear(), n.getMonth() + 1);
    const tag = n.getDate();
    const jetzt = n.getHours() * 60 + n.getMinutes();
    const treffer = [];
    d.emps.forEach(e => {
      const v = d.eintraege[e + '|' + tag];
      const p = v ? DP.fromStore(v) : null;
      if (!p || p.leer || p.code) return;
      if (jetzt >= p.von && jetzt <= p.bis) treffer.push(e);
      else treffer.push(null);
    });
    const imDienst = d.emps.filter(e => {
      const p = DP.fromStore(d.eintraege[e + '|' + tag] || '');
      return p && !p.leer && !p.code && jetzt >= p.von && jetzt <= p.bis;
    });
    return imDienst.join(', ');
  }

  /** Aufgabe abhaken. Zeitstempel wird gesetzt oder überschrieben. */
  function haken(key) {
    const t = STORE.get(key);
    if (!t) return null;
    const wer = diensthabend();
    const ts = Date.now();
    /* Ins gemeinsame Buch, damit Aufgaben und Erinnerungen in einer
       Ansicht stehen. */
    PROT.schreiben('aufgabe', t.text, wer, key);
    if (t.einmalig) { STORE.del(key); return { erledigt: true }; }
    STORE.put(key, Object.assign({}, t, { ts: ts, wer: wer }));
    return { ts: ts, wer: wer };
  }

  function neu(text, einmalig) {
    text = String(text || '').trim();
    if (!text) return null;
    const l = alle();
    const pos = l.length ? (l[l.length-1].pos || 0) + 10 : 10;
    return STORE.add('task', { text: text, pos: pos, einmalig: !!einmalig });
  }

  const weg = k => STORE.del(k);

  function schieben(key, r) {
    const l = alle();
    const i = l.findIndex(x => x._key === key), j = i + r;
    if (i < 0 || j < 0 || j >= l.length) return false;
    const a = l[i], b = l[j];
    STORE.put(a._key, Object.assign({}, a, { pos: b.pos, _key: undefined }));
    STORE.put(b._key, Object.assign({}, b, { pos: a.pos, _key: undefined }));
    return true;
  }

  /* Protokoll und Aufräumen liegen jetzt im gemeinsamen Buch. Die alten
     Namen bleiben als Durchreiche bestehen, damit nichts umgestellt werden
     muss, was sie schon benutzt. */
  const protokoll = (grenze) => PROT.alle(grenze || 200, 'aufgabe')
    .map(x => ({ _key: x._key, task: x.bezug, text: x.was, ts: x.ts, wer: x.wer }));

  const aufraeumen = () => PROT.aufraeumen();

  return { START, ersteinrichtung, alle, haken, neu, weg, schieben,
           protokoll, aufraeumen, diensthabend };
})();


/* ============================================================
   LIEFERSCHEINE – interne Schuldenliste je Kunde
   ------------------------------------------------------------
   "lkunde:<id>"  → { name, pos }
   "lpos:<id>"    → { kunde, datum, art:'offen'|'gebucht', betrag, notiz }
   ============================================================ */
const LIEF = (() => {
  const START = ['Rupi', 'Handle Giggo'];

  const kennung = (n, i) => 'lkunde:' + String(n).toLowerCase()
    .replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,20) + '_' + i;

  function ersteinrichtung() {
    let n = 0;
    START.forEach((name, i) => {
      const k = kennung(name, i);
      if (STORE.raw().items[k]) return;
      STORE.seed(k, { name: name, pos: (i + 1) * 10 });
      n++;
    });
    return n;
  }

  const kunden = () => STORE.list('lkunde').sort((a,b) => (a.pos||0) - (b.pos||0));

  function kundeNeu(name) {
    name = String(name || '').trim();
    if (!name) return null;
    const l = kunden();
    const pos = l.length ? (l[l.length-1].pos || 0) + 10 : 10;
    return STORE.add('lkunde', { name: name, pos: pos });
  }

  function kundeWeg(key) {
    STORE.list('lpos').forEach(p => { if (p.kunde === key) STORE.del(p._key); });
    STORE.del(key);
  }

  /** Buchungen eines Kunden, älteste zuerst – wie ein Kassenbuch. */
  const posten = (kunde) => STORE.list('lpos')
    .filter(p => p.kunde === kunde)
    .sort((a,b) => String(a.datum||'').localeCompare(String(b.datum||'')) ||
                   (a._id > b._id ? 1 : -1));

  /** Betrag aus der Eingabe. "12,50" und "12.50" sind dasselbe. */
  function betrag(text) {
    const s = String(text == null ? '' : text).replace(/\s|€/g,'').replace(',', '.');
    if (!s) return null;
    const n = parseFloat(s);
    if (isNaN(n) || n < 0) return null;
    return Math.round(n * 100) / 100;
  }

  function buchen(kunde, datum, art, wert, notiz) {
    const b = betrag(wert);
    if (b === null) return null;
    if (art !== 'offen' && art !== 'gebucht') return null;
    return STORE.add('lpos', { kunde: kunde, datum: datum || heuteISO(),
                               art: art, betrag: b, notiz: String(notiz||'').trim() });
  }

  const heuteISO = () => {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') +
           '-' + String(d.getDate()).padStart(2,'0');
  };

  /** Summen: offen, gebucht, Saldo. */
  function saldo(kunde) {
    let offen = 0, gebucht = 0;
    posten(kunde).forEach(p => {
      if (p.art === 'offen') offen += (p.betrag || 0);
      else gebucht += (p.betrag || 0);
    });
    return { offen: Math.round(offen*100)/100,
             gebucht: Math.round(gebucht*100)/100,
             saldo: Math.round((offen - gebucht)*100)/100 };
  }

  const eur = v => (v == null ? '–'
    : v.toFixed(2).replace('.', ',') + ' €');

  return { START, ersteinrichtung, kunden, kundeNeu, kundeWeg,
           posten, buchen, saldo, betrag, eur, heuteISO };
})();

    ['Winkler','LA-954DH','',{2026:'a'},true],
    ['Griggi','LA-3GLO','',{2026:'a'},true]
  ];

  const kennung = (kz, i) => 'vign:' + String(kz).toLowerCase()
    .replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,18) + '_' + i;

  function ersteinrichtung() {

    START.forEach((r, i) => {
      const k = kennung(r[1], i);
      if (STORE.raw().items[k]) return;
      const jahre = {};
      Object.keys(r[3]).forEach(j => {
        jahre[j] = { a: r[3][j], f: (r[4] && String(j) === '2026') ? true : false };
      });
      STORE.seed(k, { kunde: r[0], kz: r[1], notiz: r[2], jahre: jahre, pos: (i+1)*10 });
      n++;

  const alle = () => STORE.list('vign').sort((a,b) => (a.pos||0) - (b.pos||0));

  /** Nach Kunde gruppiert, Reihenfolge wie angelegt. */
  function nachKunde() {
    const out = [];
    const idx = {};
    alle().forEach(v => {
      if (!(v.kunde in idx)) { idx[v.kunde] = out.length; out.push({ kunde: v.kunde, autos: [] }); }
      out[idx[v.kunde]].autos.push(v);

  /** Welche Jahre kommen vor? Aufsteigend, immer bis zum laufenden Jahr. */
  function jahre() {

    alle().forEach(v => Object.keys(v.jahre || {}).forEach(j => s.add(+j)));

    for (let j = jetzt - 1; j <= jetzt + 1; j++) s.add(j);

    if (feld === 'a') e.a = e.a ? '' : 'a';
